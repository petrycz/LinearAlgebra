/* ================= MODULE 3 ================= */
function m3_intro(){
  stage.innerHTML=`<div class="card"><h2>Adding a ruler and a protractor</h2>
    <p>So far a vector space has had no notion of <em>length</em> or <em>angle</em> — only directions and combinations. Modules 1–2 never needed them. But most of what makes linear algebra <em>useful</em> — measuring error, saying two things are unrelated, fitting a line to data — is about size and perpendicularity.</p>
    <p>One operation supplies both, and you've already met it in disguise: the <b>dot product</b>. From it we get length, angle, the precise meaning of <b>orthogonal</b>, and <b>projection</b> — dropping a vector onto a subspace. Projection is the workhorse: it's least-squares regression, it's the "closest point" you derived by hand for the y=x line, and it's what finally shows the null space sitting exactly perpendicular to the row space, completing Module 2's picture.</p>
    <p class="small">Everything in this module is built on one number formed from two vectors. Let's define it and squeeze out its geometry.</p></div>`;
  setHints([]);unlock();
}
function m3_dot(){
  stage.innerHTML=`<div class="card"><h2>The dot product, and the angle hiding in it</h2>
    <p>The <b>dot product</b> of two vectors is multiply-matching-components-and-add:</p>
    <div class="eqbox">u · v = u₁v₁ + u₂v₂ + … + uₙvₙ</div>
    <p>One number from two vectors. Its whole importance is a second identity connecting it to geometry:</p>
    <div class="eqbox">u · v = ‖u‖ ‖v‖ cos θ&nbsp;&nbsp;<span style="color:#5d7186">θ = angle between them</span></div>
    <p>So the dot product measures <em>alignment</em>: largest when the vectors point the same way (cos θ = 1), zero when perpendicular (cos θ = 0), negative when opposed. Drag the vectors and watch the sign of <span class="mono">u·v</span> flip as the angle passes 90°.</p>
    <canvas id="cv" width="640" height="300"></canvas>
    <div class="readout"><div class="rd"><div class="k">u · v</div><div class="v" id="dv">—</div></div><div class="rd"><div class="k">angle</div><div class="v" id="ang">—</div></div></div>
    <div class="task"><b>Find the sign change</b>Position the vectors so that <span class="mono">u · v = 0</span> (to within rounding). What is the angle there?</div></div>`;
  const cv=document.getElementById('cv');const w=world(cv,34);let u={x:3,y:1},v={x:1,y:2},done=false;
  function draw(){axes(w);arrow(w,{x:0,y:0},u,'#e8b84b','u');arrow(w,{x:0,y:0},v,'#58c4dd','v');
    const d=u.x*v.x+u.y*v.y;const lu=Math.hypot(u.x,u.y),lv=Math.hypot(v.x,v.y);
    const ang=(lu*lv<1e-6)?0:Math.acos(Math.max(-1,Math.min(1,d/(lu*lv))))*180/Math.PI;
    const dv=document.getElementById('dv');dv.textContent=(d>0?'+':'')+d;dv.style.color=d>0.3?'#3fb98f':(d<-0.3?'#e2664f':'#e8b84b');
    document.getElementById('ang').textContent=ang.toFixed(0)+'°';
    if(!done&&Math.abs(d)<0.01&&lu>0.5&&lv>0.5){done=true;flash('✓ Perpendicular');
      addReveal(`<div class="rh">✓ Zero dot product = right angle</div><p>The angle is <b>90°</b>. From <span class="mono">u·v = ‖u‖‖v‖cos θ</span>, a zero dot product (with nonzero vectors) forces <span class="mono">cos θ = 0</span>, i.e. θ = 90°. This is the definition we'll lean on constantly: <b>u ⟂ v exactly when u · v = 0</b> — a purely algebraic test for a geometric fact.</p>`);}}
  drag(cv,w,()=>[{key:'u',at:u},{key:'v',at:v}],(k,m)=>{if(k==='u')u=m;else v=m;draw();});
  draw();
  setHints([`u·v = u₁v₁ + u₂v₂. Make that sum zero while keeping both vectors nonzero.`,`E.g. u=(3,1) and v=(−1,3): u·v = −3+3 = 0, and they sit at 90°.`]);
}
function m3_dotwhy(){
  stage.innerHTML=`<div class="card"><h2>Why the two formulas are the same number</h2>
    <p>We've used <span class="mono">u·v</span> two ways — the components version <span class="mono">u₁v₁+u₂v₂</span> and the geometric version <span class="mono">‖u‖‖v‖cosθ</span>. One is pure arithmetic, the other is all about angle. Why on earth are they equal? Let's actually derive it, because the bridge between them is a triangle.</p>
    <p>Picture the vectors <span class="mono">u</span> and <span class="mono">v</span> as two sides of a triangle from the origin; the third side, joining their tips, is the vector <span class="mono">u − v</span>. The angle between u and v is θ. The <b>law of cosines</b> (the generalization of Pythagoras to any angle) relates the three side lengths:</p>
    <svg class="dia" viewBox="0 0 360 250" style="max-width:340px;margin:6px auto 2px;display:block">
      <defs><marker id="ahd" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#7f92a8"/></marker></defs>
      <!-- origin bottom-left; v to the right, u up-right -->
      <!-- u = (250,60) tip ; v = (300,200) tip ; origin (60,210) -->
      <line x1="60" y1="210" x2="252" y2="66" stroke="#58c4dd" stroke-width="3" marker-end="url(#ahd)"/>
      <line x1="60" y1="210" x2="300" y2="196" stroke="#3fb98f" stroke-width="3" marker-end="url(#ahd)"/>
      <line x1="300" y1="200" x2="255" y2="68" stroke="#e8b84b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#ahd)"/>
      <!-- angle arc at origin between u and v -->
      <path d="M 96 200 A 40 40 0 0 0 92 176" fill="none" stroke="#7f92a8" stroke-width="1.5"/>
      <circle cx="60" cy="210" r="3.5" fill="#8095ab"/>
      <text class="svgt" fill="#58c4dd" x="150" y="128" text-anchor="middle">u</text>
      <text class="svgt" fill="#3fb98f" x="180" y="220" text-anchor="middle">v</text>
      <text class="svgt" fill="#e8b84b" x="292" y="132" text-anchor="start">u − v</text>
      <text class="svgt" fill="#9fb0c4" x="104" y="188" text-anchor="middle">θ</text>
    </svg>
    <p class="small" style="margin-top:2px;text-align:center;color:#5d7186">Two sides u, v from the origin; the dashed third side is u − v; θ is the angle between u and v.</p>
    <div class="eqbox">‖u − v‖² = ‖u‖² + ‖v‖² − 2‖u‖‖v‖cosθ</div>
    <p>Now expand that same left side <span class="mono">‖u−v‖²</span> a <em>different</em> way — with the components/dot-product rules from the last two beats (‖w‖² = w·w, and the dot product distributes):</p>
    <div class="eqbox">‖u−v‖² = (u−v)·(u−v) = u·u − 2(u·v) + v·v = ‖u‖² + ‖v‖² − 2(u·v)</div>
    <p>Set the two expansions of the same quantity equal. The <span class="mono">‖u‖² + ‖v‖²</span> cancels from both sides, leaving just the middle terms:</p>
    <div class="eqbox">−2(u·v) = −2‖u‖‖v‖cosθ&nbsp;&nbsp;→&nbsp;&nbsp;<span class="hl">u·v = ‖u‖‖v‖cosθ</span></div>
    <div class="task"><b>Spot the bridge</b>Which single fact forced the two formulas to agree?</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['the law of cosines','y'],['that u and v are unit vectors','n'],['the Pythagorean theorem (needs a right angle)','n'],['that the dot product is defined that way','n']];
  shuffle(opts);
  const chd=document.getElementById('ch');let done=false;chd.innerHTML=opts.map((o,i)=>`<div class="choice" data-i="${i}">${o[0]}</div>`).join('');
  chd.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    chd.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();
    addReveal(`<div class="rh">✓ The law of cosines is the bridge</div><p>Both derivations compute the <em>same</em> length, <span class="mono">‖u−v‖²</span> — one route brings in the angle (law of cosines), the other brings in the components (distributing the dot product). Forcing them equal makes the angle and the components meet, and <span class="mono">u₁v₁+u₂v₂ = ‖u‖‖v‖cosθ</span> falls out. Not a coincidence and not a definition to memorize — a triangle identity in disguise. (The Pythagorean version is just the special case θ = 90°, where cosθ = 0 and the dot product vanishes — exactly the orthogonality test.)</p>`);});
  setHints([`Both sides of the derivation are two different expansions of one quantity — the squared length of the third side of the triangle.`]);
}
function m3_norm(){
  stage.innerHTML=`<div class="card"><h2>Length, from the dot product</h2>
    <p>Point the dot product at itself and you get length. <span class="mono">v · v = v₁² + v₂² + …</span> is the sum of squared components — Pythagoras. So the <b>norm</b> (length) is:</p>
    <div class="eqbox">‖v‖ = √(v · v) = √(v₁² + v₂² + …)</div>
    <p>This is why the dot product is called an <b>inner product</b>: it induces both angle (via cos θ) and length (via √(v·v)) from one operation. A <b>unit vector</b> has ‖v‖ = 1; you make one by dividing a vector by its own length, <span class="mono">v / ‖v‖</span> — same direction, length 1. Unit vectors matter because projecting and measuring "how much in this direction" are cleanest when the direction has length 1 (you'll see exactly why two beats from now).</p>
    <div class="eqbox">A = ${mat('3','?','4','?')}&nbsp;&nbsp;→&nbsp;&nbsp;first column (3, 4)</div>
    <div class="task"><b>Compute a length</b>What is the norm ‖(3, 4)‖ of the first column?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),5,()=>{addReveal(`<div class="rh">✓ Length 5</div><p>‖(3,4)‖ = √(3² + 4²) = √(9+16) = √25 = 5 — the classic 3-4-5 right triangle. To turn it into a unit vector, divide by 5: <span class="mono">(3/5, 4/5)</span>, which has length √(9/25 + 16/25) = 1. Same direction, standardized length.</p>`);});
  setHints([`‖v‖ = √(v₁² + v₂²). Here that's √(3² + 4²).`,`√(9 + 16) = √25 = 5.`]);
}
function m3_ortho(){
  stage.innerHTML=`<div class="card"><h2>Orthogonality: no shared component</h2>
    <p>Two vectors are <b>orthogonal</b> (perpendicular) when <span class="mono">u · v = 0</span>. The meaning is sharper than "at 90°": it says <em>neither vector has any component along the other</em> — they carry completely independent information. Moving along <span class="mono">u</span> changes nothing about your position along <span class="mono">v</span>.</p>
    <p>This is why <b>orthonormal</b> sets (mutually orthogonal <em>and</em> each unit length) are the gold-standard bases you met earlier. With an orthonormal basis, the coordinate of a vector along each basis direction is just a dot product — no solving a system, because the directions don't interfere. That "no interference" is exactly orthogonality.</p>
    <div class="task"><b>Build an orthogonal partner</b>Given <span class="mono">u = (2, 1)</span>, find a nonzero vector <span class="mono">v</span> orthogonal to it. Enter <span class="mono">v</span> as <span class="mono">x, y</span>.</div>
    <div class="entry"><input id="ni" placeholder="x, y"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),0,()=>{addReveal(`<div class="rh">✓ Orthogonal</div><p>You need <span class="mono">2x + y = 0</span>, i.e. any nonzero multiple of <span class="mono">(1, −2)</span> or <span class="mono">(−1, 2)</span>. In 2D the orthogonal direction is unique up to sign — rotate u by 90° and you get (−1, 2) from (2,1). Check: (2,1)·(1,−2) = 2 − 2 = 0. ✓</p>`);},
    s=>{const p=parseVec(s);return (p.length>=2 && !(p[0]===0&&p[1]===0)) ? (2*p[0]+1*p[1]) : NaN;});
  setHints([`Orthogonal means u·v = 0, i.e. 2x + y = 0. Pick any nonzero (x,y) satisfying it.`,`Try (1, −2): 2·1 + 1·(−2) = 0. Or (−1, 2).`]);
}
function m3_project(){
  stage.innerHTML=`<div class="card"><h2>Projection: the closest point in a direction</h2>
    <p>Here's the operation everything's been building to. Given a vector <span class="mono">b</span> and a direction <span class="mono">a</span>, the <b>projection of b onto a</b> is the point on the line through <span class="mono">a</span> that's <em>closest</em> to <span class="mono">b</span> — the shadow <span class="mono">b</span> casts on that line.</p>
    <p>Its length is "how much of <span class="mono">b</span> points along <span class="mono">a</span>," which is a dot product. The formula:</p>
    <div class="eqbox">proj<sub>a</sub> b = ( <span class="hl">a · b</span> / a · a ) a</div>
    <p>Read it as: <span class="mono">(a·b)/(a·a)</span> is the scalar "how many copies of a," then you lay down that many copies of <span class="mono">a</span>. If <span class="mono">a</span> is a <em>unit</em> vector, <span class="mono">a·a = 1</span> and it simplifies to <span class="mono">(a·b) a</span> — which is why unit vectors are so convenient. Drag <span style="color:var(--accent)">b</span> and watch its projection (gold) slide along the fixed line; the dashed segment — the <b>error</b> <span class="mono">b − proj</span> — always meets the line at a right angle.</p>
    <canvas id="cv" width="640" height="300"></canvas>
    <p class="small" id="obs" style="margin-top:10px"></p></div>`;
  const cv=document.getElementById('cv');const w=world(cv,34);const a={x:3,y:1};let b={x:1,y:3};
  function draw(){axes(w);const{ctx}=w;const u=Math.hypot(a.x,a.y);const ex={x:a.x/u*9,y:a.y/u*9};
    ctx.strokeStyle="rgba(88,196,221,0.35)";ctx.lineWidth=2;const A=w.toPx({x:-ex.x,y:-ex.y}),B=w.toPx({x:ex.x,y:ex.y});ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
    const t=(a.x*b.x+a.y*b.y)/(a.x*a.x+a.y*a.y);const p={x:t*a.x,y:t*a.y};
    ctx.strokeStyle="rgba(226,102,79,0.8)";ctx.lineWidth=2;ctx.setLineDash([5,5]);const Pb=w.toPx(b),Pp=w.toPx(p);ctx.beginPath();ctx.moveTo(Pb.x,Pb.y);ctx.lineTo(Pp.x,Pp.y);ctx.stroke();ctx.setLineDash([]);
    arrow(w,{x:0,y:0},a,'#58c4dd','a');arrow(w,{x:0,y:0},b,'#e9eef6','b');arrow(w,{x:0,y:0},p,'#e8b84b','proj');
    const err={x:b.x-p.x,y:b.y-p.y};const chk=Math.abs(err.x*a.x+err.y*a.y);
    document.getElementById('obs').innerHTML='The red error <span class="mono">b − proj</span> meets the line at 90°: error · a = '+chk.toFixed(2)+' ≈ 0. That perpendicularity is what "closest" means.';}
  drag(cv,w,()=>[{key:'b',at:b}],(k,m)=>{b=m;draw();});
  draw();
  setHints([]);unlock();
}
function m3_projmatrix(){
  stage.innerHTML=`<div class="card"><h2>Projection as a matrix — the y=x line, the right way</h2>
    <p>Projection onto a fixed line is a <em>linear map</em>, so (Module 1) it must be a matrix. Let's derive it and finally re-earn the <span class="mono">y = x</span> result you got by rotations.</p>
    <p>First, one small tool we'll lean on: the <b>transpose</b>. Writing <span class="mono">ᵀ</span> flips rows and columns — a column vector <span class="mono">u</span> laid on its side becomes a row <span class="mono">uᵀ</span>. Two consequences make the algebra click:</p>
    <div class="eqbox">uᵀv = u · v&nbsp;&nbsp;<span style="color:#5d7186">row × column = the dot product (a scalar)</span><br>u vᵀ = a matrix&nbsp;&nbsp;<span style="color:#5d7186">column × row = the outer product (n × n)</span></div>
    <p class="small">Also handy, used in this module's problems: <span class="mono">(Aᵀ)ᵀ = A</span>, and transposing a product reverses the order, <span class="mono">(AB)ᵀ = BᵀAᵀ</span>.</p>
    <p>Now: take a unit direction <span class="mono">u</span> along the line. The projection of any <span class="mono">b</span> is <span class="mono">(u·b) u</span>. Rewriting <span class="mono">u·b</span> as <span class="mono">uᵀb</span> and regrouping, <span class="mono">(uᵀb)u = u(uᵀb) = (u uᵀ)b</span> — so the projection matrix is the <b>outer product</b>:</p>
    <div class="eqbox">P = u uᵀ&nbsp;&nbsp;<span style="color:#5d7186">column u times row uᵀ = a matrix</span></div>
    <p>For <span class="mono">y = x</span>: the line's unit direction is <span class="mono">u = (1/√2)(1, 1)</span>. Then</p>
    <div class="eqbox">P = u uᵀ = (1/2) ${mat('1','1','1','1')} = ${mat('0.5','0.5','0.5','0.5')}</div>
    <p>So <span class="mono">P(x, y) = ((x+y)/2, (x+y)/2)</span> — the projection <em>averages the coordinates</em>, landing every point on <span class="mono">y = x</span>. This is exactly the matrix you built with rotate-drop-rotate in Module 1; now you see the one-line reason. Two defining properties:</p>
    <div class="eqbox">Pᵀ = P&nbsp;&nbsp;<span style="color:#5d7186">symmetric</span>&nbsp;&nbsp;·&nbsp;&nbsp;P² = P&nbsp;&nbsp;<span style="color:#5d7186">idempotent</span></div>
    <div class="task"><b>Confirm idempotence</b>For P = ${mat('0.5','0.5','0.5','0.5')}, compute the top-left entry of <span class="mono">P²</span> — row 1 of P dotted with column 1 of P.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ 0.5 — so P² = P</div><p>Row 1 of P is (0.5, 0.5); column 1 is (0.5, 0.5)ᵀ. Their dot product is 0.5·0.5 + 0.5·0.5 = 0.25 + 0.25 = 0.5 — the same entry P already had. Every entry works out this way, so <span class="mono">P² = P</span>. Meaning: once you've projected onto the line, you're already on it, so projecting again does nothing. Idempotence <em>is</em> "projection," now proven algebraically rather than argued geometrically.</p>`);},s=>parseFloat(s));
  setHints([`P²'s top-left = (row 1 of P) · (column 1 of P) = (0.5,0.5)·(0.5,0.5).`,`0.5·0.5 + 0.5·0.5 = 0.25 + 0.25 = 0.5.`]);
}
function m3_complement(){
  stage.innerHTML=`<div class="card"><h2>Completing the four subspaces</h2>
    <p>Now the payoff promised in Module 2. The <b>orthogonal complement</b> of a subspace <span class="mono">S</span>, written <span class="mono">S⟂</span>, is the set of all vectors orthogonal to <em>everything</em> in <span class="mono">S</span>. In the plane, the complement of a line is the perpendicular line; in 3D, the complement of a plane is the normal line.</p>
    <p>Here's the clean fact that ties Module 2 and 3 together. Take any row of <span class="mono">A</span> and any vector <span class="mono">v</span> in the null space. By definition <span class="mono">Av = 0</span>, and each entry of <span class="mono">Av</span> is exactly <em>(that row) · v</em>. So:</p>
    <div class="eqbox">Av = 0&nbsp;&nbsp;⟺&nbsp;&nbsp;(every row) · v = 0&nbsp;&nbsp;⟺&nbsp;&nbsp;v ⟂ every row</div>
    <p>A vector is in the null space precisely when it's orthogonal to every row — hence orthogonal to the whole <b>row space</b>. Therefore:</p>
    <div class="eqbox">N(A) = ( row space )⟂&nbsp;&nbsp;<span style="color:#5d7186">null space ⟂ row space, in ℝⁿ</span></div>
    <p>The same argument on <span class="mono">Aᵀ</span> gives the output side: the left null space is the orthogonal complement of the column space in <span class="mono">ℝᵐ</span>. So the four subspaces aren't just four dimensions that happen to add up — they split each space into <b>perpendicular pairs</b>: ℝⁿ = row space ⊕ null space, and ℝᵐ = column space ⊕ left null space, each pair meeting only at the origin and at right angles. <em>That</em> is the fundamental theorem of linear algebra, and it's why "solving Ax = b" and "least squares" work the way they do.</p></div>`;
  setHints([]);unlock();
}
function m3_apps(){
  stage.innerHTML=`<div class="card"><h2>Why projection runs so much</h2>
    <p><b>Least squares (the big one).</b> When <span class="mono">Ax = b</span> has no exact solution — more equations than unknowns, noisy data — you find the <span class="mono">x</span> making <span class="mono">Ax</span> as close to <span class="mono">b</span> as possible. "As close as possible" means <b>project b onto the column space of A</b>: the best <span class="mono">Ax</span> is the projection, and the leftover error is orthogonal to the column space. That single idea is linear regression, curve fitting, and the normal equations <span class="mono">AᵀAx = Aᵀb</span>.</p>
    <p><b>Machine learning.</b> Cosine similarity — how "aligned" two embeddings are — is literally the <span class="mono">cos θ</span> from the dot product, normalized. Orthogonality shows up as decorrelated features; projection is dimensionality reduction (keep the components along the top directions, drop the rest — PCA again).</p>
    <p><b>Mean-centering = projection.</b> Subtracting the mean from data is orthogonal projection onto the all-ones direction, then taking the complement — the 2D "average the coordinates" you poked at, in n dimensions.</p>
    <p><b>Signal processing.</b> The Fourier transform <em>is</em> orthogonal projection: the coefficients are inner products of a signal with orthogonal basis functions (sines and cosines), and the signal is the sum of its projections. Orthogonality is exactly why each frequency can be recovered independently.</p>
    <div class="code"><div class="ch">python · numpy</div><pre><span class="kw">import</span> numpy <span class="kw">as</span> np

a = np.array([<span class="num">3</span>, <span class="num">1</span>]); b = np.array([<span class="num">1</span>, <span class="num">3</span>])
<span class="fn">print</span>(a @ b)                       <span class="cmt"># 6   (dot product)</span>
<span class="fn">print</span>(np.linalg.norm(a))          <span class="cmt"># length of a</span>

<span class="cmt"># projection of b onto a</span>
p = (a @ b) / (a @ a) * a
<span class="fn">print</span>(p)                           <span class="cmt"># the shadow of b on a's line</span>
<span class="fn">print</span>((b - p) @ a)                 <span class="cmt"># ~0: error is orthogonal to a</span>

<span class="cmt"># projection matrix onto the line y = x</span>
u = np.array([<span class="num">1</span>, <span class="num">1</span>]) / np.sqrt(<span class="num">2</span>)
P = np.outer(u, u)
<span class="fn">print</span>(P)                           <span class="cmt"># [[0.5 0.5],[0.5 0.5]]</span>
<span class="fn">print</span>(np.allclose(P @ P, P))       <span class="cmt"># True  (idempotent)</span></pre></div></div>`;
  setHints([]);unlock();
}
function m3_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Strang-level, within Modules 1–3 (linear maps, subspaces, rank, dot product, norm, orthogonality, projection). Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">compute</span><div class="ph">Problem 1</div>
    <p>For <span class="mono">u = (1, 2, 2)</span> and <span class="mono">v = (2, −1, 2)</span>, find <span class="mono">u·v</span>, <span class="mono">‖u‖</span>, and the cosine of the angle between them.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>u·v = 1·2 + 2·(−1) + 2·2 = 2 − 2 + 4 = 4. ‖u‖ = √(1+4+4) = 3, ‖v‖ = √(4+1+4) = 3. cos θ = (u·v)/(‖u‖‖v‖) = 4/9. (So θ ≈ 63.6°.)</p></div></details></div>

    <div class="prob"><span class="lvl">compute</span><div class="ph">Problem 2</div>
    <p>Project <span class="mono">b = (4, 0)</span> onto the direction <span class="mono">a = (1, 1)</span>. Verify the error <span class="mono">b − proj</span> is orthogonal to <span class="mono">a</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>proj = (a·b)/(a·a) · a = (4)/(2) · (1,1) = 2(1,1) = (2, 2). Error = b − proj = (4,0) − (2,2) = (2, −2). Check: (2,−2)·(1,1) = 2 − 2 = 0. ✓ Orthogonal, as projection guarantees. (Note (2,2) is on the line y=x — same projection your matrix P computes.)</p></div></details></div>

    <div class="prob"><span class="lvl">derive</span><div class="ph">Problem 3</div>
    <p>Find the matrix that projects onto the line spanned by <span class="mono">a = (2, 1)</span>, using <span class="mono">P = (a aᵀ)/(a·a)</span>. Confirm <span class="mono">P² = P</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>a·a = 4+1 = 5. a aᵀ = ${mat('4','2','2','1')}. So P = (1/5)${mat('4','2','2','1')} = ${mat('0.8','0.4','0.4','0.2')}. Idempotence: P² top-left = 0.8² + 0.4² = 0.64 + 0.16 = 0.8 ✓; the other entries check similarly, so P² = P. (Since a isn't unit length, dividing by a·a = 5 is the normalization — for a unit vector it would be 1.)</p></div></details></div>

    <div class="prob"><span class="lvl">proof</span><div class="ph">Problem 4</div>
    <p>Prove that if <span class="mono">u · v = 0</span> then <span class="mono">‖u + v‖² = ‖u‖² + ‖v‖²</span> — the Pythagorean theorem for orthogonal vectors.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>‖u+v‖² = (u+v)·(u+v) = u·u + 2(u·v) + v·v (expanding, using that the dot product distributes and is symmetric). If u·v = 0 the middle term vanishes, leaving u·u + v·v = ‖u‖² + ‖v‖². ✓ Conversely, the cross term 2(u·v) is exactly the "interference" orthogonality removes.</p></div></details></div>

    <div class="prob"><span class="lvl">connect to Module 2</span><div class="ph">Problem 5</div>
    <p>Let <span class="mono">A</span> have rows <span class="mono">(1, 2, 1)</span> and <span class="mono">(0, 1, 1)</span>. Find a nonzero vector in the null space and confirm directly that it is orthogonal to both rows.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Solve Av = 0: x + 2y + z = 0 and y + z = 0. From the second, z = −y; substitute: x + 2y − y = 0 → x = −y. So v = y(−1, 1, −1); take v = (−1, 1, −1). Check orthogonality: (1,2,1)·(−1,1,−1) = −1+2−1 = 0 ✓ and (0,1,1)·(−1,1,−1) = 0+1−1 = 0 ✓. The null space vector is perpendicular to every row — N(A) = (row space)⟂ in action.</p></div></details></div>

    <div class="prob"><span class="lvl">proof</span><div class="ph">Problem 6</div>
    <p>Show that a projection matrix <span class="mono">P = (a aᵀ)/(a·a)</span> is symmetric (<span class="mono">Pᵀ = P</span>) and satisfies <span class="mono">P² = P</span>, for any nonzero <span class="mono">a</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p><b>Symmetric:</b> (a aᵀ)ᵀ = (aᵀ)ᵀ aᵀ = a aᵀ, and dividing by the scalar a·a preserves this, so Pᵀ = P. <b>Idempotent:</b> P² = (a aᵀ)(a aᵀ)/(a·a)² = a (aᵀa) aᵀ/(a·a)². But aᵀa = a·a is a scalar, so this is (a·a)·(a aᵀ)/(a·a)² = (a aᵀ)/(a·a) = P. The scalar in the middle cancels one factor, leaving P. ✓</p></div></details></div>

    <div class="prob"><span class="lvl">challenge</span><div class="ph">Problem 7</div>
    <p>Given the line <span class="mono">S = span{(1,1)}</span> in ℝ², describe <span class="mono">S⟂</span> explicitly, and show every vector <span class="mono">b</span> splits uniquely as (something in S) + (something in S⟂). Illustrate with <span class="mono">b = (3, 1)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>S⟂ = all vectors orthogonal to (1,1): (x,y) with x+y = 0, i.e. span{(1,−1)}. To split b, project onto each: proj onto S = ((1,1)·b/2)(1,1); proj onto S⟂ = ((1,−1)·b/2)(1,−1). For b=(3,1): onto S = (4/2)(1,1) = (2,2); onto S⟂ = (2/2)(1,−1) = (1,−1). Sum: (2,2)+(1,−1) = (3,1) = b ✓. The split is unique because S and S⟂ meet only at 0 and together span ℝ² — the orthogonal decomposition of the whole space.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
function m3_recap(){
  stage.innerHTML=`<div class="card"><h2>What you built</h2>
    <div class="eqbox" style="line-height:1.95">u · v = ‖u‖‖v‖cos θ&nbsp;&nbsp;<span style="color:#5d7186">alignment: angle + length in one</span><br>‖v‖ = √(v·v)&nbsp;&nbsp;<span style="color:#5d7186">length from the inner product</span><br>u ⟂ v ⟺ u·v = 0&nbsp;&nbsp;<span style="color:#5d7186">orthogonality, algebraically</span><br>P = u uᵀ&nbsp;&nbsp;<span style="color:#5d7186">projection onto a line; Pᵀ=P, P²=P</span><br>N(A) = (row space)⟂&nbsp;&nbsp;<span style="color:#5d7186">the four subspaces, completed</span></div>
    <p>You now have length, angle, perpendicularity, and projection — and the fundamental theorem splitting each space into orthogonal pairs. The projection you first cracked with trig is now a one-line outer product.</p>
    <p><b>Next — Module 4:</b> eigenvalues and eigenvectors. Instead of asking "what does the map do to the standard axes," we ask "are there special directions the map leaves alone (just scaling them)?" Those invariant directions reveal what a matrix does when applied over and over — and set up the spectral theorem and the SVD.</p></div>`;
  setHints([]);unlock();
}

/* ================= MODULE 4 ================= */
function m4_intro(){
  stage.innerHTML=`<div class="card"><h2>The directions a matrix leaves alone</h2>
    <p>Every question so far asked "what does the map do to the standard axes?" Now flip it: <b>are there special directions the map <em>doesn't</em> knock off course — ones it merely stretches or shrinks, without rotating?</b></p>
    <p>Most vectors, when you hit them with a matrix, come out pointing somewhere new. But special directions survive: <span class="mono">Av</span> lands right back on the same line as <span class="mono">v</span>, just longer or shorter. Those are the <b>eigenvectors</b>, and the stretch factor is the <b>eigenvalue</b>.</p>
    <p>Why care? Because they reveal what a matrix <em>really</em> does, especially when applied repeatedly. Apply a map a thousand times and generic vectors tumble around unpredictably — but an eigenvector just keeps scaling by the same factor. That single fact underlies population/dynamical models, the stability of systems (their natural modes and resonances), Google's PageRank, and PCA. Eigenvectors are the matrix's natural coordinate system.</p></div>`;
  setHints([]);unlock();
}
function m4_discover(){
  stage.innerHTML=`<div class="card"><h2>Hunt for the invariant directions</h2>
    <p>Below, a fixed matrix <span class="mono">A</span> acts on whatever <span style="color:var(--accent)">v</span> you drag, producing <span style="color:var(--gold)">Av</span>. For most directions the two arrows point different ways. Find the special ones.</p>
    <canvas id="cv" width="640" height="300"></canvas>
    <div class="readout"><div class="rd"><div class="k">v</div><div class="v" id="vv">—</div></div><div class="rd"><div class="k">Av</div><div class="v" id="av">—</div></div><div class="rd"><div class="k">on same line?</div><div class="v" id="par">—</div></div></div>
    <div class="task"><b>Find an invariant direction</b>Drag v until <span class="mono">Av</span> lies on the <b>same line</b> as v (pointing the same way or exactly opposite). Those are the directions A only scales.</div></div>`;
  const cv=document.getElementById('cv');const w=world(cv,30);const A={a:2,b:1,c:1,d:2};let v={x:2,y:0.5},done=false;
  function draw(){axes(w);const Av=ap(A,v);arrow(w,{x:0,y:0},v,'#58c4dd','v');arrow(w,{x:0,y:0},Av,'#e8b84b','Av');
    const cross=v.x*Av.y-v.y*Av.x;const par=(Math.abs(cross)<0.6&&Math.hypot(v.x,v.y)>0.9);
    document.getElementById('vv').textContent='('+v.x+', '+v.y+')';document.getElementById('av').textContent='('+Av.x+', '+Av.y+')';
    const lam=(v.x*Av.x+v.y*Av.y)/(v.x*v.x+v.y*v.y);
    const pe=document.getElementById('par');pe.textContent=par?('yes, λ ≈ '+lam.toFixed(1)):'no';pe.style.color=par?'#3fb98f':'#8095ab';
    if(!done&&par){done=true;flash('✓ Eigenvector!');
      addReveal(`<div class="rh">✓ You found an eigenvector</div><p>When <span class="mono">Av</span> lands on <span class="mono">v</span>'s own line, <span class="mono">Av = λv</span> for some number λ — the direction is <em>invariant</em>, only scaled. This matrix has two such directions: <span class="mono">(1, 1)</span>, where <span class="mono">Av = 3v</span> (λ = 3), and <span class="mono">(1, −1)</span>, where <span class="mono">Av = 1v</span> (λ = 1). Every other direction gets rotated off its line. Those two special directions are the eigenvectors; 3 and 1 are the eigenvalues.</p>`);}}
  drag(cv,w,()=>[{key:'v',at:v}],(k,m)=>{v=m;draw();});
  draw();
  setHints([`Try directions along the diagonals. What happens at v = (1, 1)? At v = (1, −1)?`,`v = (1,1) gives Av = (3,3) — same direction, tripled. v = (1,−1) gives Av = (1,−1) — unchanged.`]);
}
function m4_define(){
  stage.innerHTML=`<div class="card"><h2>The definition</h2>
    <p>An <b>eigenvector</b> of <span class="mono">A</span> is a nonzero vector <span class="mono">v</span> whose image stays on its own line:</p>
    <div class="eqbox">A v = λ v&nbsp;&nbsp;&nbsp;(v ≠ 0)</div>
    <p>The scalar <span class="mono">λ</span> (lambda) is the <b>eigenvalue</b> — the factor by which that direction is scaled. The whole line through an eigenvector is invariant. What the eigenvalue tells you geometrically:</p>
    <div class="eqbox" style="line-height:1.9">λ &gt; 1&nbsp; stretch&nbsp;·&nbsp; 0 &lt; λ &lt; 1&nbsp; shrink<br>λ &lt; 0&nbsp; flip to the other side&nbsp;·&nbsp; λ = 1&nbsp; unchanged<br>λ = 0&nbsp; collapse to the origin&nbsp;<span style="color:#5d7186">(that v is in the null space!)</span></div>
    <p>That last line is a bridge to Module 2: <span class="mono">λ = 0</span> means <span class="mono">Av = 0</span> for a nonzero <span class="mono">v</span> — an eigenvalue of zero is exactly a nonzero null space. Eigenvalues and the null space are the same story at <span class="mono">λ = 0</span>.</p>
    <p>One warning worth stating early: some real matrices (a pure rotation, say) have <em>no</em> real eigenvectors — no direction survives a 90° turn. Their eigenvalues turn out complex. We'll meet that in the problems — complex numbers handle it cleanly.</p></div>`;
  setHints([]);unlock();
}
function m4_det(){
  stage.innerHTML=`<div class="card"><h2>The tool we need: the 2×2 determinant</h2>
    <p>To <em>find</em> eigenvalues we need one small new instrument. Recall from Module 2 that a matrix is <b>singular</b> (rank-deficient) exactly when its columns are dependent — equivalently, when it has a nonzero null space. For a 2×2 matrix there's a single number that detects this:</p>
    <div class="eqbox">det ${mat('a','b','c','d')} = ad − bc</div>
    <p>The <b>determinant</b> is zero precisely when the matrix is singular. Geometrically (from your Module 1 area intuition) <span class="mono">|ad − bc|</span> is the area the unit square maps to; area zero means the square is squashed flat onto a line — dependent columns, a nonzero null space. So:</p>
    <div class="eqbox">det A = 0&nbsp;&nbsp;⟺&nbsp;&nbsp;A is singular&nbsp;&nbsp;⟺&nbsp;&nbsp;A v = 0 has a nonzero solution</div>
    <p class="small">That equivalence is all we need from determinants here — the general n×n theory is a larger topic we'll take on only if a later problem demands it.</p>
    <div class="task"><b>Warm up</b>Compute det ${mat('3','2','1','4')}.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),10,()=>{addReveal(`<div class="rh">✓ 10</div><p>ad − bc = 3·4 − 2·1 = 12 − 2 = 10. Nonzero, so this matrix is invertible (full rank, trivial null space). Now we can turn "find the λ that makes A − λI singular" into a solvable equation.</p>`);});
  setHints([`det = (top-left × bottom-right) − (top-right × bottom-left).`,`3·4 − 2·1 = 12 − 2 = 10.`]);
}
function m4_find(){
  stage.innerHTML=`<div class="card"><h2>Finding the eigenvalues</h2>
    <p>Rearrange the definition. <span class="mono">Av = λv</span> means <span class="mono">Av − λv = 0</span>, and writing <span class="mono">λv = λI v</span> (with <span class="mono">I</span> the identity) gives:</p>
    <div class="eqbox">(A − λI) v = 0</div>
    <p>We need a <em>nonzero</em> <span class="mono">v</span> solving this — i.e. <span class="mono">A − λI</span> must have a nonzero null space, i.e. it must be <b>singular</b>. By the last beat, that means its determinant is zero:</p>
    <div class="eqbox">det(A − λI) = 0&nbsp;&nbsp;<span style="color:#5d7186">the characteristic equation</span></div>
    <p>This is one equation in the unknown <span class="mono">λ</span>. Work it out for <span class="mono">A = ${mat('2','1','1','2')}</span>:</p>
    <div class="eqbox">A − λI = ${mat('2−λ','1','1','2−λ')}<br>det = (2−λ)² − 1 = 0&nbsp;→&nbsp;(2−λ)² = 1&nbsp;→&nbsp;2−λ = ±1<br>λ = 1&nbsp; or&nbsp; λ = 3</div>
    <p>Exactly the two eigenvalues you found by dragging. The characteristic equation is always a polynomial in <span class="mono">λ</span> (degree = matrix size); its roots are the eigenvalues.</p>
    <p>A useful shortcut falls out for <b>triangular</b> matrices (zeros above or below the diagonal): the determinant of <span class="mono">A − λI</span> is just the product of diagonal entries, so the eigenvalues <em>are</em> the diagonal.</p>
    <div class="task"><b>Use the shortcut</b>The matrix ${mat('5','7','0','3')} is triangular. Enter its larger eigenvalue.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),5,()=>{addReveal(`<div class="rh">✓ 5</div><p>det(A − λI) = (5−λ)(3−λ) − 7·0 = (5−λ)(3−λ), zero at λ = 5 and λ = 3. The off-diagonal 7 never enters — for triangular matrices the eigenvalues sit right on the diagonal. Larger is 5.</p>`);});
  setHints([`For a triangular matrix the eigenvalues are the diagonal entries.`,`Diagonal is 5 and 3; the larger is 5.`]);
}
function m4_eigenvectors(){
  stage.innerHTML=`<div class="card"><h2>Finding the eigenvectors</h2>
    <p>Once you have an eigenvalue, its eigenvectors are just the <b>null space of</b> <span class="mono">A − λI</span> — exactly the Module 2 skill. Plug the λ in and solve <span class="mono">(A − λI)v = 0</span>.</p>
    <p>For <span class="mono">A = ${mat('2','1','1','2')}</span>, take <span class="mono">λ = 3</span>:</p>
    <div class="eqbox">A − 3I = ${mat('−1','1','1','−1')}&nbsp;&nbsp;→&nbsp;&nbsp;−x + y = 0&nbsp;→&nbsp;y = x</div>
    <p>So every multiple of <span class="mono">(1, 1)</span> is an eigenvector for λ = 3. Check: <span class="mono">A(1,1) = (3,3) = 3·(1,1)</span>. ✓</p>
    <div class="task"><b>Your turn — the other eigenvector</b>For the same A, take <span class="mono">λ = 1</span>. Solve <span class="mono">(A − I)v = 0</span> and enter any nonzero eigenvector as <span class="mono">x, y</span>.</div>
    <div class="entry"><input id="ni" placeholder="x, y"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),0,()=>{addReveal(`<div class="rh">✓ Eigenvector for λ = 1</div><p>A − I = ${mat('1','1','1','1')}, so <span class="mono">(A−I)v = 0</span> means <span class="mono">x + y = 0</span> — any multiple of <span class="mono">(1, −1)</span>. Check: <span class="mono">A(1,−1) = (2−1, 1−2) = (1, −1) = 1·(1,−1)</span>. ✓ The two eigenvectors (1,1) and (1,−1) happen to be orthogonal here — no accident, and the subject of Module 5.</p>`);},
    s=>{const p=parseVec(s);return (p.length>=2 && !(p[0]===0&&p[1]===0)) ? (p[0]+p[1]) : NaN;});
  setHints([`A − I = [[1,1],[1,1]], so you need x + y = 0.`,`Any nonzero multiple of (1, −1): e.g. (1,−1) or (2,−2).`]);
}
function m4_eigencoords(){
  stage.innerHTML=`<div class="card"><h2>The eigenbasis: where A gets simple</h2>
    <p>Applying A to a random vector is a tangle — the output points somewhere new, and if you want to apply A again and again it only gets worse. Watch what happens when we stop using the standard axes and describe the vector in terms of A's <em>own</em> eigenvectors instead.</p>
    <p>Keep <span class="mono">A = ${mat('2','1','1','2')}</span>, with eigenvectors <span class="cy">e₊ = (1, 1)</span> (λ = 3) and <span class="grn">e₋ = (1, −1)</span> (λ = 1).</p>
    <p>First, what does "describe a vector in a different basis" even mean? Ordinary coordinates are secretly instructions <em>in the standard axes</em>: <span class="mono">(5, 1)</span> means "5 steps along <span class="mono">e₁ = (1,0)</span>, 1 step along <span class="mono">e₂ = (0,1)</span>" — that is, <span class="mono">(5,1) = 5e₁ + 1e₂</span>, the split you saw in Module 1. But <em>any</em> pair of independent vectors can serve as axes. To <b>rewrite v in the eigenbasis</b> is to find the new instructions — how many steps along <span class="cy">e₊</span> and along <span class="grn">e₋</span> — that reach the same point:</p>
    <div class="eqbox">v = (5, 1) = a·<span class="cy">(1, 1)</span> + b·<span class="grn">(1, −1)</span></div>
    <p>The pair <span class="mono">(a, b)</span> is <em>the same arrow</em>, just measured against different axes — its <b>eigen-coordinates</b>. Finding them means solving for a and b.</p>
    <div class="task"><b>Find the eigen-coordinates</b>Solve the two equations <span class="mono">a + b = 5</span> and <span class="mono">a − b = 1</span> (one per component). Enter as <span class="mono">a, b</span>.</div>
    <div class="entry"><input id="ni" placeholder="a, b"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <div id="more"></div></div>`;
  numChk(stage.querySelector('.card'),[3,2],()=>{
    document.getElementById('more').innerHTML=`<div class="reveal"><div class="rh">✓ v = 3·(1,1) + 2·(1,−1)</div>
      <p>So in the standard axes v is <span class="mono">(5, 1)</span>, and in the eigenbasis the very same arrow is <span class="mono">(3, 2)</span> — two coordinate systems, one vector. Now apply A — here's the magic. A <em>scales each eigenvector by its own λ</em> and does nothing else, so by linearity:</p>
      <div class="eqbox">Av = 3·A(1,1) + 2·A(1,−1)<br>&nbsp;&nbsp;&nbsp;= 3·<span class="cy">3</span>·(1,1) + 2·<span class="grn">1</span>·(1,−1)<br>&nbsp;&nbsp;&nbsp;= 9·(1,1) + 2·(1,−1) = (11, 7)</div>
      <p>Check the plodding way: A(5,1) = (2·5+1·1, 1·5+2·1) = (11, 7). ✓ Same answer — but look at <em>how</em> we got it: no matrix grinding, just "scale the <span class="cy">3</span>-piece by <span class="cy">3</span>, scale the <span class="grn">2</span>-piece by <span class="grn">1</span>." In the eigenbasis, A is nothing but two independent scalings. That's the whole point — and the next beat packages these steps into matrices so you can do it to any vector at once.</p></div>`;
    unlock();},s=>parseVec(s));

}
function m4_diagonalize(){
  stage.innerHTML=`<div class="card"><h2>Packaging it: A = P D P⁻¹</h2>
    <p>The three moves from the last beat — <b>rewrite in eigen-coordinates</b>, <b>scale each by its λ</b>, <b>rebuild the ordinary vector</b> — are each a matrix. Let's name them, spelling everything out.</p>
    <p><b>P — rebuild.</b> Put the eigenvectors in the columns:</p>
    <div class="eqbox">P = ${mat('1','1','1','−1')}&nbsp;&nbsp;<span style="color:#5d7186">columns are e₊, e₋</span></div>
    <p>P turns eigen-coordinates back into an ordinary vector: <span class="mono">P·(a,b) = a(1,1) + b(1,−1)</span>. For (a,b) = (3,2): <span class="mono">P(3,2) = (3+2, 3−2) = (5, 1) = v</span>. ✓</p>
    <p><b>D — scale.</b> Eigenvalues on the diagonal, matched to P's columns:</p>
    <div class="eqbox">D = ${mat('3','0','0','1')}&nbsp;&nbsp;<span style="color:#5d7186">scales the e₊ piece ×3, the e₋ piece ×1</span></div>
    <p><b>P⁻¹ — rewrite in eigen-coordinates.</b> This step needs a genuinely new tool: the <b>inverse</b>. The inverse <span class="mono">P⁻¹</span> is the matrix that <em>undoes</em> P — formally <span class="mono">P⁻¹P = P P⁻¹ = I</span>, where <span class="mono">I = ${mat('1','0','0','1')}</span> is the identity that leaves every vector unchanged. It exists exactly when the matrix is full rank, i.e. <span class="mono">det ≠ 0</span> (Modules 2 and 4) — a singular matrix destroys information and can't be undone. For a 2×2 there's a clean formula:</p>
    <div class="eqbox">${mat('a','b','c','d')}<sup>−1</sup> = (1 / (ad − bc)) · ${mat('d','−b','−c','a')}</div>
    <p>Apply it to our P (det = (1)(−1) − (1)(1) = −2):</p>
    <div class="eqbox">P⁻¹ = (1/−2)·${mat('−1','−1','−1','1')} = ${mat('0.5','0.5','0.5','−0.5')}</div>
    <p>And it really does extract the eigen-coordinates: <span class="mono">P⁻¹(5,1) = (0.5·5 + 0.5·1, 0.5·5 − 0.5·1) = (3, 2) = (a, b)</span>. ✓ It's the machine that solved that little system for you in one multiply.</p>
    <p><b>Order them</b> — read right to left and they do the three steps in turn:</p>
    <div class="eqbox">A = P D P⁻¹ = ${mat('1','1','1','−1')}${mat('3','0','0','1')}${mat('0.5','0.5','0.5','−0.5')}</div>
    <p>Trace <span class="mono">v = (5,1)</span> straight through: <span class="mono">P⁻¹</span> → (3, 2), then <span class="mono">D</span> → (9, 2), then <span class="mono">P</span> → (11, 7) = Av. The same (11, 7) the eigenbasis beat got, now revealed as <em>translate to eigen-coords · scale · translate back</em>. That is diagonalization: <b>A is only complicated because we insist on the standard axes; in its own eigenbasis it is pure scaling.</b></p>
    <div class="task"><b>Confirm the inverse exists</b>Using the formula, compute det of P = ${mat('1','1','1','−1')} (you need it for P⁻¹). Enter the number.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <div id="more"></div></div>`;
  numChk(stage.querySelector('.card'),-2,()=>{
    document.getElementById('more').innerHTML=`<div class="reveal"><div class="rh">✓ det P = −2 (nonzero, so P⁻¹ exists)</div>
      <p>(1)(−1) − (1)(1) = −1 − 1 = −2. Because it's nonzero, the eigenvectors are independent and the eigenbasis is genuine. Now the real payoff.</p>
      <p><b>Iterating becomes almost free.</b> Watch the inner <span class="mono">P⁻¹P</span> pairs collapse to the identity and vanish:</p>
      <div class="eqbox">A² = (P D P⁻¹)(P D P⁻¹) = P D (P⁻¹P) D P⁻¹ = P D I D P⁻¹ = P D² P⁻¹</div>
      <div class="eqbox">and in general&nbsp;&nbsp;Aⁿ = P Dⁿ P⁻¹</div>
      <p>Raising A to a huge power — an avalanche of matrix multiplications — collapses to raising each eigenvalue to that power, since <span class="mono">Dⁿ = ${mat('3ⁿ','0','0','1ⁿ')}</span>. For example A⁵ scales the (1,1)-piece by <span class="mono">3⁵ = 243</span> and the (1,−1)-piece by <span class="mono">1⁵ = 1</span>. Split any vector into eigen-pieces and each simply scales by <span class="mono">λⁿ</span> — so as n grows the largest-|λ| direction runs away with everything. <em>That</em> domination is exactly PageRank, Markov steady states, and stability analysis, all downstream of this one factorization.</p></div>`;
    unlock();},s=>parseFloat((s||'').replace(/[−–—]/g,'-')));
  setHints([`det = ad − bc. For P, a=1, b=1, c=1, d=−1.`,`(1)(−1) − (1)(1) = −1 − 1 = −2.`]);
}
function m4_apps(){
  stage.innerHTML=`<div class="card"><h2>Eigenvectors in the wild</h2>
    <p><b>Iterated systems & stability.</b> Any process that repeatedly applies a matrix — a population model, a Markov chain, a discrete control loop — is governed by its eigenvalues. If every <span class="mono">|λ| &lt; 1</span> the system decays to zero (stable); if any <span class="mono">|λ| &gt; 1</span> it blows up along that eigenvector. The dominant eigenvalue sets the long-run behavior.</p>
    <p><b>PageRank.</b> Google models the web as a giant Markov matrix and ranks pages by the <em>dominant eigenvector</em> — the steady-state distribution of a random surfer. The whole algorithm is "find the top eigenvector."</p>
    <p><b>PCA.</b> The principal components of data are the eigenvectors of its covariance matrix; the eigenvalues say how much variance each captures. Keeping the top few = compressing data along its most informative directions. (The SVD in Module 6 is the same idea, generalized.)</p>
    <p><b>Physics &amp; engineering.</b> Eigenvectors are the natural modes of a system; eigenvalues are resonant frequencies or decay rates. Solving linear ODEs and analyzing circuits and vibrations all follow one pattern: "diagonalize, evolve each mode independently, recombine."</p>
    <div class="code"><div class="ch">python · numpy</div><pre><span class="kw">import</span> numpy <span class="kw">as</span> np

A = np.array([[<span class="num">2</span>, <span class="num">1</span>],
              [<span class="num">1</span>, <span class="num">2</span>]])

vals, vecs = np.linalg.eig(A)
<span class="fn">print</span>(vals)          <span class="cmt"># [3. 1.]  the eigenvalues</span>
<span class="fn">print</span>(vecs)          <span class="cmt"># columns are the (unit) eigenvectors</span>

<span class="cmt"># verify A v = lambda v for the first eigenpair</span>
v0 = vecs[:, <span class="num">0</span>]
<span class="fn">print</span>(A @ v0, vals[<span class="num">0</span>] * v0)   <span class="cmt"># equal</span>

<span class="cmt"># diagonalize and take a big power cheaply</span>
P, D = vecs, np.diag(vals)
A5 = P @ np.diag(vals**<span class="num">5</span>) @ np.linalg.inv(P)
<span class="fn">print</span>(A5 @ np.array([<span class="num">1</span>, <span class="num">0</span>]))   <span class="cmt"># [122. 121.]</span></pre></div></div>`;
  setHints([]);unlock();
}
function m4_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Strang-level, within Modules 1–4 (linear maps, subspaces, null space, dot product, the 2×2 determinant, eigen-definition). Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">compute</span><div class="ph">Problem 1</div>
    <p>Find the eigenvalues and eigenvectors of <span class="mono">A = ${mat('4','1','2','3')}</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>det(A − λI) = (4−λ)(3−λ) − 1·2 = λ² − 7λ + 12 − 2 = λ² − 7λ + 10 = (λ−5)(λ−2). Eigenvalues λ = 5, 2.</p>
    <p>λ=5: A−5I = ${mat('−1','1','2','−2')}, so −x+y = 0 → y = x → eigenvector (1, 1). λ=2: A−2I = ${mat('2','1','2','1')}, so 2x+y = 0 → eigenvector (1, −2). Check: A(1,1)=(5,5)=5(1,1) ✓; A(1,−2)=(4−2, 2−6)=(2,−4)=2(1,−2) ✓.</p></div></details></div>

    <div class="prob"><span class="lvl">inspection + reason</span><div class="ph">Problem 2</div>
    <p>Write down the eigenvalues of <span class="mono">${mat('6','0','0','−2')}</span> and of <span class="mono">${mat('1','9','0','4')}</span> without computing a determinant, and justify.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Both are diagonal or triangular, so det(A−λI) is the product of the diagonal entries of A−λI, giving eigenvalues equal to A's diagonal. First: λ = 6, −2 (a diagonal matrix already scales the axes — the standard basis vectors <em>are</em> its eigenvectors). Second: λ = 1, 4. The off-diagonal 9 doesn't affect the eigenvalues (it does tilt the eigenvectors).</p></div></details></div>

    <div class="prob"><span class="lvl">proof (connect Module 2)</span><div class="ph">Problem 3</div>
    <p>Prove that <span class="mono">λ = 0</span> is an eigenvalue of <span class="mono">A</span> if and only if <span class="mono">A</span> is singular (has a nonzero null space).</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>λ=0 is an eigenvalue ⟺ there is a nonzero v with Av = 0·v = 0 ⟺ Av = 0 has a nonzero solution ⟺ the null space is nontrivial ⟺ A is singular. Each step is a definition. So a zero eigenvalue and a nonzero null space are literally the same condition — eigenvalues extend the Module 2 story from "sent to 0" to "sent to λ times itself."</p></div></details></div>

    <div class="prob"><span class="lvl">proof</span><div class="ph">Problem 4</div>
    <p>Show that if <span class="mono">Av = λv</span>, then <span class="mono">A²v = λ²v</span>, and more generally <span class="mono">Aⁿv = λⁿv</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>A²v = A(Av) = A(λv) = λ(Av) = λ(λv) = λ²v, using linearity to pull the scalar out. Induct: if Aⁿv = λⁿv, then Aⁿ⁺¹v = A(λⁿv) = λⁿ(Av) = λⁿ·λv = λⁿ⁺¹v. So an eigenvector stays an eigenvector under any power, with the eigenvalue raised to that power — the reason iterating a matrix is governed by its eigenvalues.</p></div></details></div>

    <div class="prob"><span class="lvl">complex eigenvalues</span><div class="ph">Problem 5</div>
    <p>Find the eigenvalues of the 90° rotation <span class="mono">R = ${mat('0','−1','1','0')}</span>. Interpret the result geometrically.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>det(R − λI) = (−λ)(−λ) − (−1)(1) = λ² + 1 = 0 → λ = ±i. The eigenvalues are imaginary, meaning <b>no real eigenvector exists</b> — and geometrically that's obvious: a 90° rotation moves <em>every</em> real direction off its own line, so nothing real is merely scaled. Complex eigenvalues are the algebra's way of encoding rotation. (Their magnitude |λ| = 1 reflects that a rotation preserves length.)</p></div></details></div>

    <div class="prob"><span class="lvl">diagonalize</span><div class="ph">Problem 6</div>
    <p>For <span class="mono">A = ${mat('2','1','1','2')}</span>, write a diagonalization <span class="mono">A = PDP⁻¹</span> (give P and D). You need not compute <span class="mono">P⁻¹</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Eigenpairs (from the beats): λ=3 with (1,1), λ=1 with (1,−1). Put the eigenvectors in P's columns and the matching eigenvalues in D: P = ${mat('1','1','1','−1')}, D = ${mat('3','0','0','1')}. Then A = PDP⁻¹. (Order is free, as long as each eigenvalue in D matches its eigenvector's column in P.)</p></div></details></div>

    <div class="prob"><span class="lvl">challenge</span><div class="ph">Problem 7</div>
    <p>Using the eigen-decomposition of <span class="mono">A = ${mat('2','1','1','2')}</span>, compute <span class="mono">A⁵(1, 0)</span> <em>without</em> multiplying matrices five times — by splitting <span class="mono">(1,0)</span> into eigenvectors.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Write (1,0) in the eigenbasis: (1,0) = a(1,1) + b(1,−1). Then a+b = 1 and a−b = 0, so a = b = ½. Applying A⁵ scales the (1,1) piece by 3⁵ = 243 and the (1,−1) piece by 1⁵ = 1:</p>
    <p>A⁵(1,0) = ½·243·(1,1) + ½·1·(1,−1) = (121.5, 121.5) + (0.5, −0.5) = <b>(122, 121)</b>.</p>
    <p>Matches the NumPy check. This is the whole reason eigenvectors matter for iteration: decompose once, then every power is just scaling each piece — and for large n the biggest-λ piece dominates everything else.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function m5_intro(){
  stage.innerHTML=`<div class="card"><h2>The best-behaved matrices there are</h2>
    <p>Remember the loose end from Module 4: the two eigenvectors of <span class="mono">${mat('2','1','1','2')}</span> came out <em>perpendicular</em> — (1,1) and (1,−1) — and I said that was no accident. Here's the cause: that matrix is <b>symmetric</b>.</p>
    <p>A matrix is symmetric when it equals its own transpose, <span class="mono">A = Aᵀ</span> — a mirror image across the diagonal. Symmetric matrices are the aristocrats of linear algebra: they are <em>guaranteed</em> to have <b>real eigenvalues</b> and a full set of <b>orthogonal eigenvectors</b>. No complex numbers, no defective cases, ever. That guarantee is the <b>spectral theorem</b> — the cleanest and most useful decomposition short of the SVD.</p>
    <p>And it's not an edge case; symmetric matrices are the ones you actually meet: covariance matrices (statistics / PCA), Gram matrices <span class="mono">AᵀA</span>, Hessians (the second-derivative matrix in optimization), inertia and stress tensors (physics), and adjacency matrices of undirected graphs — all symmetric. Master this family and a huge swath of applied math opens up.</p></div>`;
  setHints([]);unlock();
}
function m5_symmetric(){

    <p><span class="mono">A = Aᵀ</span> means <span class="mono">aᵢⱼ = aⱼᵢ</span> — the entry in row i, column j equals the one in row j, column i. The matrix is unchanged when reflected across the main diagonal.</p>

    <p>A hugely important source: <b>for any matrix A whatsoever, AᵀA is symmetric.</b> (You'll prove it in the problems — a one-liner with the transpose rules from Module 3.) That's why symmetric matrices are unavoidable: covariance is essentially <span class="mono">AᵀA</span> on centered data, and least squares runs on <span class="mono">AᵀA</span>.</p>
    <div class="task"><b>Make it symmetric</b>For <span class="mono">${mat('5','3','?','5')}</span> to be symmetric, what must the bottom-left entry be?</div>

function m5_proof(){
  stage.innerHTML=`<div class="card"><h2>Prove it can't be otherwise</h2>
    <p>You watched a symmetric matrix's eigenvectors come out perpendicular. Is that luck, or law? Let's find out with a classic move: compute one innocent number <em>two different ways</em> and see what it forces.</p>
    <p>Take symmetric <span class="mono">A = Aᵀ</span> with eigenvectors for two <em>different</em> eigenvalues: <span class="mono">Av₁ = λ₁v₁</span> and <span class="mono">Av₂ = λ₂v₂</span> with <span class="mono">λ₁ ≠ λ₂</span>. The number we'll compute is <span class="mono">v₁ᵀA v₂</span>.</p>
    <p>Two transpose facts from Module 3's primer do the heavy lifting — worth keeping in view:</p>
    <div class="eqbox">uᵀv = u · v&nbsp;&nbsp;<span style="color:#5d7186">a row times a column is the dot product</span><br>(AB)ᵀ = BᵀAᵀ&nbsp;&nbsp;<span style="color:#5d7186">transpose reverses a product</span></div>
    <p><b>Way 1 — let A act to its right, on v₂.</b> Use <span class="mono">Av₂ = λ₂v₂</span>, then <span class="mono">uᵀv = u·v</span> for the final step:</p>
    <div class="eqbox">v₁ᵀ(A v₂) = v₁ᵀ(λ₂ v₂) = λ₂ (v₁ · v₂)</div>
    <p><b>Way 2 — let A act to its left, on v₁.</b> This is where symmetry earns its keep, in two small transpose moves. First substitute <span class="mono">A = Aᵀ</span>, so <span class="mono">v₁ᵀA = v₁ᵀAᵀ</span>. Then apply the reversal rule <span class="mono">(AB)ᵀ = BᵀAᵀ</span> <em>read backwards</em>: <span class="mono">v₁ᵀAᵀ = (A v₁)ᵀ</span> (take <span class="mono">A</span> and <span class="mono">v₁</span> as the two factors). Together <span class="mono">v₁ᵀA = (A v₁)ᵀ</span>, and since <span class="mono">Av₁ = λ₁v₁</span>:</p>
    <div class="eqbox">(A v₁)ᵀ v₂ = (λ₁ v₁)ᵀ v₂ = λ₁ (v₁ · v₂)</div>
    <p>But both computed the <em>same number</em> <span class="mono">v₁ᵀAv₂</span> — so they must be equal:</p>
    <div class="eqbox">λ₁ (v₁·v₂) = λ₂ (v₁·v₂)&nbsp;&nbsp;→&nbsp;&nbsp;(λ₁ − λ₂)(v₁ · v₂) = 0</div>
    <div class="task"><b>You finish the proof</b>We're told λ₁ ≠ λ₂, so (λ₁ − λ₂) is <em>not</em> zero. For the product (λ₁ − λ₂)(v₁·v₂) to equal zero, what must be true?</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['<span class="cm">v₁ · v₂ = 0</span> — the eigenvectors are orthogonal','y'],
    ['<span class="cm">λ₁ = λ₂</span>','n'],['<span class="cm">v₁ = v₂</span>','n'],['nothing can be concluded','n']];
  shuffle(opts);

  chd.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    chd.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();
    addReveal(`<div class="rh">✓ v₁ · v₂ = 0 — orthogonal, and it's law</div><p>A product is zero only when a factor is zero. Since <span class="mono">λ₁ − λ₂ ≠ 0</span>, the other factor <span class="mono">v₁·v₂</span> must vanish. So eigenvectors of a symmetric matrix for distinct eigenvalues are <b>forced</b> perpendicular — not luck. The one ingredient that made it happen was <span class="mono">A = Aᵀ</span>, which let us slide A across the dot product. (If an eigenvalue repeats, you can still <em>choose</em> an orthogonal set inside that eigenspace, so the theorem holds in full.)</p>`);});
  setHints([`A product of two numbers is zero only if at least one of them is zero — and here one factor, (λ₁−λ₂), is already known to be nonzero.`]);
}
function m5_orthomatrix(){
  stage.innerHTML=`<div class="card"><h2>Orthogonal matrices: the inverse is free</h2>
    <p>Collect orthonormal vectors (mutually orthogonal <em>and</em> each unit length) into the columns of a matrix and you get an <b>orthogonal matrix</b> <span class="mono">Q</span>. Its defining property comes straight from the columns:</p>
    <div class="eqbox">QᵀQ = I&nbsp;&nbsp;<span style="color:#5d7186">entry (i,j) = qᵢ · qⱼ = 1 if i=j, else 0</span></div>
    <p>Look at what <span class="mono">QᵀQ = I</span> says: <span class="mono">Qᵀ</span> <em>is</em> the inverse. So for an orthogonal matrix,</p>
    <div class="eqbox">Q⁻¹ = Qᵀ&nbsp;&nbsp;<span style="color:#5d7186">no inverse formula needed — just transpose</span></div>
    <p>You already saw a case in Module 1: a rotation's inverse was its transpose (<span class="mono">R(θ)⁻¹ = R(−θ)</span>). Orthogonal matrices are exactly the rotations and reflections — the maps that <b>preserve length and angle</b> (you'll prove <span class="mono">‖Qx‖ = ‖x‖</span> in the problems); they move space rigidly.</p>
    <p>Normalize our eigenvectors (1,1) and (1,−1) by dividing by their length √2:</p>

    <div class="task"><b>Confirm orthonormal columns</b>Compute <span class="mono">q₁ · q₂</span>, where q₁ = (1/√2, 1/√2) and q₂ = (1/√2, −1/√2).</div>

function m5_spectral(){
  stage.innerHTML=`<div class="card"><h2>The spectral theorem: A = Q Λ Qᵀ</h2>
    <p>Module 4 diagonalized as <span class="mono">A = P D P⁻¹</span>, and computing <span class="mono">P⁻¹</span> was a chore. Watch what symmetry buys us, one step at a time.</p>
    <p><b>Step 1.</b> A symmetric matrix's eigenvectors are orthogonal (you just proved it). Normalize each to unit length and they become <em>orthonormal</em>.</p>
    <p><b>Step 2.</b> Stack those orthonormal eigenvectors as columns — that's an <b>orthogonal matrix</b> <span class="mono">Q</span>, and for an orthogonal matrix the inverse is free: <span class="mono">Q⁻¹ = Qᵀ</span> (last beat).</p>
    <p><b>Step 3.</b> So in the diagonalization, the ugly <span class="mono">P⁻¹</span> collapses to a plain transpose:</p>
    <div class="eqbox">A = P D P⁻¹&nbsp;&nbsp;becomes&nbsp;&nbsp;A = Q Λ Qᵀ</div>
    <div class="task"><b>The Spectral Theorem</b>Every real symmetric matrix <span class="mono">A</span> can be written <span class="mono">A = QΛQᵀ</span>, where <span class="mono">Q</span> is orthogonal (its columns are orthonormal eigenvectors of A) and <span class="mono">Λ</span> is diagonal (the real eigenvalues). Said without matrices: <em>a real symmetric matrix always has a full set of orthonormal eigenvectors, and every eigenvalue is real.</em> That guarantee is what no general matrix gets.</div>
    <p>Spelled out for <span class="mono">A = ${mat('3','1','1','3')}</span> (λ = 4, 2), with the normalized eigenvectors:</p>
    <div class="eqbox">Q = (1/√2)${mat('1','1','1','−1')},&nbsp;Λ = ${mat('4','0','0','2')},&nbsp;A = Q Λ Qᵀ</div>
    <p>Read right to left, the three factors are Module 4's three moves again: <span class="mono">Qᵀ</span> first, then <span class="mono">Λ</span>, then <span class="mono">Q</span>. Recall from Module 3 that with an <em>orthonormal</em> basis, a vector's coordinate along each axis is just its dot product with that axis — and the rows of <span class="mono">Qᵀ</span> are precisely the orthonormal eigenvectors.</p>
    <div class="task"><b>Name the step</b>Applying <span class="mono">A x = Q Λ Qᵀ x</span> right to left, what does the first factor <span class="mono">Qᵀ</span> do to <span class="mono">x</span>?</div>

  const opts=[['rewrites x in the orthonormal eigenbasis — gives x\'s eigen-coordinates','y'],

  chd.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    chd.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();
    addReveal(`<div class="rh">✓ Qᵀ means "into the eigenbasis"</div><p>Its rows are the orthonormal eigenvectors, so <span class="mono">Qᵀx</span> is the list of dot products — exactly x's coordinates along each eigen-axis. That's the change of basis from Module 4, now done by a plain transpose <em>because</em> the axes are orthonormal. Then <span class="mono">Λ</span> scales each coordinate and <span class="mono">Q</span> rebuilds. A symmetric matrix is pure real scaling in its own orthonormal axes, and getting in and out costs only a transpose.</p>`);});
  setHints([`Right-to-left the three factors mirror Module 4's "translate to eigen-coords → scale → translate back." Which move is "translate to eigen-coords"?`]);
