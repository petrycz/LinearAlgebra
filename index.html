function m5_spectraldecomp(){
  stage.innerHTML=`<div class="card"><h2>A as a sum of projections</h2>
    <p>The spectral theorem has a second face that's just as useful — but first, a quick reminder from Module 3.</p>
    <p><b>The projection matrix, refreshed.</b> For a <em>unit</em> vector q, the matrix <span class="mono">q qᵀ</span> (a column times a row, so it's an n×n matrix) projects any vector onto q's line. Applied to x: <span class="mono">(q qᵀ)x = q (qᵀx) = (q·x) q</span> — "measure the shadow length <span class="mono">q·x</span>, then lay down that much of q." It's the closest-point-on-the-q-line operation, packaged as a matrix.</p>
    <p><b>The claim.</b> A symmetric matrix is a <em>weighted sum</em> of exactly these projections — one per eigenvector, each weighted by its eigenvalue:</p>
    <div class="eqbox">A = λ₁ q₁q₁ᵀ + λ₂ q₂q₂ᵀ + …</div>
    <p><b>Why this equals</b> <span class="mono">A = QΛQᵀ</span>. The clean way to see it: apply both to an arbitrary <span class="mono">x</span> and check they produce the same output. The sum gives, using the projection fact above:</p>
    <div class="eqbox">(λ₁q₁q₁ᵀ + λ₂q₂q₂ᵀ)x = λ₁(q₁·x)q₁ + λ₂(q₂·x)q₂</div>
    <p>— "project x onto each eigen-axis, scale each shadow by that axis's λ, add up." Now trace <span class="mono">QΛQᵀx</span> through its three factors (right to left): <span class="mono">Qᵀx</span> gives the shadows <span class="mono">(q₁·x, q₂·x)</span>, <span class="mono">Λ</span> scales them to <span class="mono">(λ₁(q₁·x), λ₂(q₂·x))</span>, and <span class="mono">Q</span> lays them back down as <span class="mono">λ₁(q₁·x)q₁ + λ₂(q₂·x)q₂</span>. Identical output — for <em>every</em> x — so the sum and the product are the same matrix. The two forms are one theorem, read two ways.</p>
    <p>Let's watch it rebuild A. Each <span class="mono">qᵢqᵢᵀ</span> (normalized eigenvectors, so the ½ appears), weighted by the eigenvalues 4 and 2:</p>
    <div class="eqbox">4·q₁q₁ᵀ = 4·½${mat('1','1','1','1')} = ${mat('2','2','2','2')}<br>2·q₂q₂ᵀ = 2·½${mat('1','−1','−1','1')} = ${mat('1','−1','−1','1')}</div>
    <div class="task"><b>Reassemble</b>Add those two matrices. What is the <b>top-left entry</b> of the sum?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <div id="more"></div></div>`;
  numChk(stage.querySelector('.card'),3,()=>{document.getElementById('more').innerHTML=`<div class="reveal"><div class="rh">✓ 3 — A rebuilt from its projections</div>
    <p>Top-left: 2 + 1 = 3, exactly A's top-left; all four entries give <span class="mono">${mat('3','1','1','3')}</span> back. So <span class="mono">A = 4 q₁q₁ᵀ + 2 q₂q₂ᵀ</span>. A large eigenvalue means its eigen-direction contributes heavily; a small one barely at all. This "sum of rank-1 projections, weighted by importance" is exactly the shape the <b>SVD</b> takes in Module 6 — and keeping only the largest terms is low-rank approximation and PCA.</p></div>`;unlock();});
  setHints([`Top-left entries: 2 (from the first matrix) and 1 (from the second).`,`2 + 1 = 3.`]);
}
function m5_quadform(){
  stage.innerHTML=`<div class="card"><h2>Quadratic forms: a number from squares</h2>
    <p>A <b>quadratic form</b> is a function that eats a vector and returns a single number, built only from <em>squares and products</em> of the components. It's the multivariable big sister of the familiar one-variable <span class="mono">a x²</span>. For example:</p>
    <div class="eqbox">f(x, y) = 3x² + 2xy + 3y²</div>
    <p>Every such form can be packed into a <em>symmetric</em> matrix and written compactly as <span class="mono">xᵀA x</span>. Let's watch the packing, slowly, for <span class="mono">A = ${mat('3','1','1','3')}</span> and <span class="mono">x = (x₁, x₂)</span> — first compute <span class="mono">Ax</span>, then dot it with <span class="mono">x</span>:</p>
    <div class="eqbox">A x = (3x₁ + x₂,&nbsp; x₁ + 3x₂)<br>xᵀ(Ax) = x₁(3x₁ + x₂) + x₂(x₁ + 3x₂)<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 3x₁² + 2x₁x₂ + 3x₂²</div>
    <p>So a symmetric <span class="mono">${mat('a','b','b','c')}</span> produces <span class="mono">a x₁² + 2b x₁x₂ + c x₂²</span> — the diagonal gives the pure squares, and the off-diagonal <span class="mono">b</span> gives the cross term (it appears <em>twice</em>, once from each mirrored entry, hence "2b"). The matrix is simply an organized store for a quadratic's coefficients; <span class="mono">xᵀAx</span> reads them back out.</p>
    <div class="task"><b>Evaluate the form</b>Using <span class="mono">A = ${mat('3','1','1','3')}</span>, compute <span class="mono">xᵀA x</span> for <span class="mono">x = (2, 1)</span>. (Plug into <span class="mono">3x₁² + 2x₁x₂ + 3x₂²</span>, or do Ax then dot with x.)</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),19,()=>{addReveal(`<div class="rh">✓ 19</div><p>3·(2²) + 2·(2)(1) + 3·(1²) = 12 + 4 + 3 = 19. (Or: Ax = (7, 5), then (2,1)·(7,5) = 14 + 5 = 19.) That one number is a kind of weighted "size" of x measured by A. The interesting question — is this number <em>always</em> positive, and what shape does the form make — is next.</p>`);});
  setHints([`Plug x₁ = 2, x₂ = 1 into 3x₁² + 2x₁x₂ + 3x₂².`,`3·4 + 2·2·1 + 3·1 = 12 + 4 + 3 = 19.`]);
}
function m5_posdef(){
  stage.innerHTML=`<div class="card"><h2>Positive definite: the shape of the bowl</h2>
    <p>Here's the question that makes quadratic forms matter: <b>is <span class="mono">xᵀAx</span> always positive</b>, for every nonzero x? If yes, the form is a <em>bowl</em> resting on the origin — a single lowest point at 0 — and we call A <b>positive definite</b>.</p>
    <p>The eigenvalues answer it cleanly. Rewrite x in the orthonormal eigenbasis (eigen-coordinates <span class="mono">c₁, c₂</span>). The cross term disappears and the form becomes pure squares:</p>
    <div class="eqbox">xᵀA x = λ₁ c₁² + λ₂ c₂² + …</div>
    <p>Every <span class="mono">c²</span> is ≥ 0, so the <em>signs of the eigenvalues</em> decide everything. All eigenvalues positive → the sum is always positive → <b>positive definite</b> (a bowl). A negative eigenvalue → the form dips below zero along that eigen-axis → a <b>saddle</b>.</p>
    <p>Our <span class="mono">A = ${mat('3','1','1','3')}</span> has eigenvalues 4 and 2, both positive, so <span class="mono">xᵀAx &gt; 0</span> for every nonzero x — positive definite, a bowl. (Its value 19 at (2,1) was never going to come out negative.)</p>
    <div class="task"><b>Read off the verdict</b>A symmetric matrix has eigenvalues 5 and −1. Is it positive definite? Enter <span class="mono">1</span> for yes, <span class="mono">0</span> for no.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="1 or 0"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <div id="more"></div></div>`;
  numChk(stage.querySelector('.card'),0,()=>{document.getElementById('more').innerHTML=`<div class="reveal"><div class="rh">✓ No — it's indefinite</div>
    <p>The −1 eigenvalue means the form goes <em>negative</em> along that eigenvector, so it isn't always positive — a saddle, not a bowl. Positive definite needs <em>every</em> eigenvalue &gt; 0.</p>
    <p>Why this earns its own name, one line each: a data set's <b>covariance matrix</b> is positive semidefinite (variance can't be negative); and in optimization, the <b>Hessian</b> (the matrix of second derivatives) being positive definite at a critical point means you're sitting at the bottom of a bowl — a genuine minimum. "Positive definite = convex bowl" is the multivariable second-derivative test, and the property that makes optimization well-behaved.</p></div>`;unlock();});
  setHints([`Positive definite means every eigenvalue is positive. Is −1 positive?`]);
}
function m5_apps(){
  stage.innerHTML=`<div class="card"><h2>Symmetric matrices at work</h2>
    <p><b>PCA.</b> A data set's covariance matrix is symmetric, so the spectral theorem hands you orthonormal eigenvectors — the <em>principal axes</em> — with eigenvalues equal to the variance along each. Keep the top few and you've compressed the data along its most informative, mutually perpendicular directions.</p>
    <p><b>Optimization.</b> The Hessian is symmetric. Its eigenvalues classify a critical point: all positive → local minimum (convex bowl), all negative → maximum, mixed → saddle. Positive-definiteness <em>is</em> convexity, the property that makes optimization tractable.</p>
    <p><b>Physics &amp; engineering.</b> Inertia tensors, stress tensors, and small-oscillation operators are symmetric; their orthogonal eigenvectors are the <em>normal modes</em> and the eigenvalues the squared frequencies. Coupled oscillators fully decouple in the eigenbasis — each mode rings independently.</p>
    <div class="code"><div class="ch">python · numpy</div><pre><span class="kw">import</span> numpy <span class="kw">as</span> np

A = np.array([[<span class="num">3</span>, <span class="num">1</span>],
              [<span class="num">1</span>, <span class="num">3</span>]])

<span class="cmt"># eigh: the routine for symmetric matrices —</span>
<span class="cmt"># guaranteed real eigenvalues and orthonormal eigenvectors</span>
vals, Q = np.linalg.eigh(A)
<span class="fn">print</span>(vals)            <span class="cmt"># [2. 4.]</span>
<span class="fn">print</span>(Q.T @ Q)          <span class="cmt"># identity  -> Q is orthogonal</span>

<span class="cmt"># spectral reconstruction  A = Q Lambda Q^T</span>
<span class="fn">print</span>(Q @ np.diag(vals) @ Q.T)   <span class="cmt"># back to A</span>

<span class="fn">print</span>(np.all(vals &gt; <span class="num">0</span>))     <span class="cmt"># True -> positive definite</span></pre></div></div>`;
  setHints([]);unlock();
}
function m5_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Strang-level, within Modules 1–5 (symmetric matrices, eigen-tools, transpose, orthonormal vectors, projection, quadratic forms). Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">check + proof</span><div class="ph">Problem 1</div>
    <p>(a) Is <span class="mono">${mat('2','5','5','2')}</span> symmetric? (b) Prove that <span class="mono">AᵀA</span> is symmetric for <em>any</em> matrix A.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>(a) Yes — a₂₁ = 5 = a₁₂. (b) A matrix M is symmetric iff Mᵀ = M. Compute (AᵀA)ᵀ using the reversal rule (AB)ᵀ = BᵀAᵀ: (AᵀA)ᵀ = Aᵀ(Aᵀ)ᵀ = AᵀA (since (Aᵀ)ᵀ = A). So (AᵀA)ᵀ = AᵀA — symmetric, whatever A was.</p></div></details></div>

    <div class="prob"><span class="lvl">orthogonally diagonalize</span><div class="ph">Problem 2</div>
    <p>For the symmetric <span class="mono">A = ${mat('0','2','2','3')}</span>, find the eigenvalues, orthonormal eigenvectors, and write <span class="mono">A = QΛQᵀ</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>det(A−λI) = (−λ)(3−λ) − 4 = λ² − 3λ − 4 = (λ−4)(λ+1), so λ = 4, −1. λ=4: (A−4I)=${mat('−4','2','2','−1')}, −4x+2y=0 → y=2x → (1,2). λ=−1: (A+I)=${mat('1','2','2','4')}, x+2y=0 → (2,−1). Check orthogonal: (1,2)·(2,−1)=0 ✓. Normalize by √5: q₁=(1/√5)(1,2), q₂=(1/√5)(2,−1). So Q = (1/√5)${mat('1','2','2','−1')}, Λ = ${mat('4','0','0','−1')}, and A = QΛQᵀ. (Note the negative eigenvalue — symmetric does <em>not</em> mean positive definite.)</p></div></details></div>

    <div class="prob"><span class="lvl">proof</span><div class="ph">Problem 3</div>
    <p>Prove that eigenvectors of a symmetric matrix belonging to distinct eigenvalues are orthogonal.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Let Av₁=λ₁v₁, Av₂=λ₂v₂ with λ₁≠λ₂. Then v₁ᵀAv₂ = λ₂(v₁·v₂) (group right). Also v₁ᵀAv₂ = v₁ᵀAᵀv₂ = (Av₁)ᵀv₂ = λ₁(v₁·v₂) (group left, using A=Aᵀ). Equating: (λ₁−λ₂)(v₁·v₂)=0; since λ₁≠λ₂, v₁·v₂=0. The symmetry is precisely what lets A move across the dot product.</p></div></details></div>

    <div class="prob"><span class="lvl">proof</span><div class="ph">Problem 4</div>
    <p>Show that an orthogonal matrix preserves length: if <span class="mono">QᵀQ = I</span>, then <span class="mono">‖Qx‖ = ‖x‖</span> for all x.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>‖Qx‖² = (Qx)ᵀ(Qx) = xᵀQᵀQx = xᵀI x = xᵀx = ‖x‖². Taking square roots, ‖Qx‖ = ‖x‖. (The same computation on (Qx)ᵀ(Qy) shows dot products — hence angles — are preserved too. That's why orthogonal maps are rigid motions.)</p></div></details></div>

    <div class="prob"><span class="lvl">positive definiteness</span><div class="ph">Problem 5</div>
    <p>Using eigenvalues, decide whether each is positive definite: <span class="mono">${mat('2','1','1','2')}</span> and <span class="mono">${mat('1','3','3','1')}</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>First: char (2−λ)²−1 = 0 → λ = 3, 1, both positive → <b>positive definite</b>. Second: char (1−λ)²−9 = 0 → 1−λ = ±3 → λ = 4, −2; a negative eigenvalue → <b>not</b> positive definite (indefinite — it's a saddle-shaped form, positive along one eigen-axis, negative along the other).</p></div></details></div>

    <div class="prob"><span class="lvl">derive</span><div class="ph">Problem 6</div>
    <p>Show that <span class="mono">A = QΛQᵀ</span> can be rewritten as the sum <span class="mono">A = Σᵢ λᵢ qᵢqᵢᵀ</span>, where qᵢ are the columns of Q.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>ΛQᵀ scales row i of Qᵀ (which is qᵢᵀ) by λᵢ, so ΛQᵀ has rows λᵢqᵢᵀ. Multiplying Q (columns qᵢ) by that on the left, the product QΛQᵀ is the sum over i of (column qᵢ)·(row λᵢqᵢᵀ) = Σ λᵢ qᵢqᵢᵀ. (This is the "column × row" view of matrix multiplication from Module 1: a product equals the sum of outer products of matching column/row pairs.) Each qᵢqᵢᵀ is a rank-1 projection, so A is a λ-weighted sum of projections onto its eigen-axes.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge (Rayleigh quotient)</span><div class="ph">Problem 7</div>
    <p>For symmetric A with eigenvalues λ₁ ≥ λ₂ ≥ …, prove that the maximum of <span class="mono">xᵀAx</span> over all <em>unit</em> vectors x equals λ₁ (the largest eigenvalue), attained at its eigenvector.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Write x in the orthonormal eigenbasis: x = Σ cᵢqᵢ. Because the qᵢ are orthonormal, ‖x‖² = Σcᵢ² and xᵀAx = Σ λᵢcᵢ² (cross terms vanish by orthogonality). For a unit vector, Σcᵢ² = 1, so xᵀAx = Σλᵢcᵢ² is a weighted average of the eigenvalues with weights cᵢ² summing to 1. A weighted average is largest when all the weight sits on the biggest value: put c₁ = 1 (the rest 0), i.e. x = q₁, giving xᵀAx = λ₁. So max = λ₁ at x = q₁ (and similarly the min is λ_min at its eigenvector). This is the variational meaning of eigenvalues — and the exact principle PCA uses to pick its first component: the unit direction of maximum variance is the top eigenvector of the covariance matrix.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

/* ================= MODULE 6 ================= */
function svd2(A){ // A={a,b,c,d}=[[a,b],[c,d]] -> singular values + right/left singular vectors
  const M11=A.a*A.a+A.c*A.c, M12=A.a*A.b+A.c*A.d, M22=A.b*A.b+A.d*A.d;
  const tr=M11+M22, det=M11*M22-M12*M12, disc=Math.sqrt(Math.max(0,(tr/2)*(tr/2)-det));
  const l1=tr/2+disc, l2=Math.max(0,tr/2-disc), s1=Math.sqrt(l1), s2=Math.sqrt(l2);
  function eig(l){let vx,vy;if(Math.abs(M12)>1e-9){vx=M12;vy=l-M11;}else{if(Math.abs(l-M11)<=Math.abs(l-M22)){vx=1;vy=0;}else{vx=0;vy=1;}}const n=Math.hypot(vx,vy)||1;return {x:vx/n,y:vy/n};}
  const v1=eig(l1),v2=eig(l2);
  let u1=ap(A,v1),u2=ap(A,v2);const n1=Math.hypot(u1.x,u1.y)||1,n2=Math.hypot(u2.x,u2.y)||1;
  u1={x:u1.x/n1,y:u1.y/n1};u2={x:u2.x/n2,y:u2.y/n2};
  return {s1,s2,v1,v2,u1,u2};
}
function m6_intro(){
  stage.innerHTML=`<div class="card"><h2>A decomposition for every matrix</h2>
    <p>Everything powerful so far needed a <b>square</b> matrix, and the clean version (the spectral theorem) needed a <b>symmetric</b> one. But real matrices are usually neither — a data matrix might be 100,000 images × 784 pixels, deeply rectangular. Eigenvectors give up here: for a rectangular matrix "Av = λv" doesn't even typecheck (Av and v live in different-sized spaces), and even square non-symmetric matrices can have complex or non-perpendicular eigenvectors.</p>
    <p>So ask a humbler question that turns out to have a beautiful answer for <em>every</em> matrix, any shape:</p>
    <div class="task"><b>The question</b>Is there an orthonormal set of <em>input</em> directions that A sends to a set of mutually <em>perpendicular</em> output directions?</div>
    <p>If yes, those special directions would let us describe A as "line up with these input axes, stretch along them, land on those output axes" — a clean <b>rotate · stretch · rotate</b>. The answer is yes, always, and the structure is the <b>Singular Value Decomposition</b>. We'll discover it geometrically, define it precisely, see <em>why</em> it comes from the spectral theorem, and work both a square and a rectangular example — no recipes handed down.</p></div>`;
  setHints([]);unlock();
}
function m6_ellipse(){

  const cv=document.getElementById('cv');const w=world(cv,68);const A={a:1,b:1,c:0,d:1};const sv=svd2(A);

    ctx.strokeStyle="#58c4dd";ctx.lineWidth=2;ctx.beginPath();for(let t=0;t<=6.29;t+=0.05){const p=w.toPx(ap(A,{x:Math.cos(t),y:Math.sin(t)}));t===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}ctx.closePath();ctx.stroke();
    if(done){arrow(w,{x:0,y:0},sv.v1,'#e2664f','v₁');arrow(w,{x:0,y:0},sv.v2,'#3fb98f','v₂');
      arrow(w,{x:0,y:0},{x:sv.s1*sv.u1.x,y:sv.s1*sv.u1.y},'#e2664f','σ₁u₁');arrow(w,{x:0,y:0},{x:sv.s2*sv.u2.x,y:sv.s2*sv.u2.y},'#3fb98f','σ₂u₂');}
    const Ax=ap(A,x);arrow(w,{x:0,y:0},x,'#8095ab');arrow(w,{x:0,y:0},Ax,'#e8b84b','Ax');
    const st=Math.hypot(Ax.x,Ax.y);maxSeen=Math.max(maxSeen,st);

    if(!done&&st>=sv.s1-0.03){done=true;flash('✓ Longest axis');
      addReveal(`<div class="rh">✓ Three definitions, straight from the picture</div><p>The stretch isn't uniform — it ranges from a smallest value <span class="mono">σ₂ ≈ ${sv.s2.toFixed(2)}</span> to a largest <span class="mono">σ₁ ≈ ${sv.s1.toFixed(2)}</span>. Name what you found:</p><p>• <b>Singular values</b> <span class="mono">σ₁ ≥ σ₂ ≥ …</span> — the ellipse's semi-axis lengths, i.e. the extreme stretch factors.<br>• <b>Right singular vectors</b> <span class="red">v₁, v₂</span> — the <em>input</em> unit directions that produce those extremes (they come out perpendicular).<br>• <b>Left singular vectors</b> <span class="grn">u₁, u₂</span> — the <em>output</em> directions along the ellipse's axes (also perpendicular).</p><p>So A carries one orthonormal input frame <span class="mono">{v₁, v₂}</span> onto a perpendicular, stretched output frame <span class="mono">{σ₁u₁, σ₂u₂}</span>. That answers the module's opening question — yes — and it's the entire content of the SVD.</p>`);}}
  drag(cv,w,()=>[{key:'x',at:x}],(k,m)=>{const n=Math.hypot(m.x,m.y);if(n>0.15){x={x:m.x/n,y:m.y/n};draw();}},0);

function m6_relation(){
  stage.innerHTML=`<div class="card"><h2>The defining relationship: Avᵢ = σᵢuᵢ</h2>
    <p>The picture gives one clean equation. Each right singular vector <span class="mono">vᵢ</span> (an input axis) maps to <span class="mono">σᵢ</span> times the matching left singular vector <span class="mono">uᵢ</span> (an output axis):</p>
    <div class="eqbox">A vᵢ = σᵢ uᵢ&nbsp;&nbsp;<span style="color:#5d7186">compare Av = λv — same idea, but the output direction uᵢ differs from the input vᵢ</span></div>
    <p>That single relationship <em>derives</em> the whole decomposition. The <span class="mono">vᵢ</span> are an orthonormal basis of the input space, so (Module 3) any input splits by dot products: <span class="mono">x = (v₁·x)v₁ + (v₂·x)v₂</span>. Apply A, using linearity and <span class="mono">Avᵢ = σᵢuᵢ</span>:</p>
    <div class="eqbox">Ax = (v₁·x)Av₁ + (v₂·x)Av₂ = σ₁(v₁·x)u₁ + σ₂(v₂·x)u₂</div>
    <p>It's a "sum of scaled projections" (like Module 5's <span class="mono">Σ λᵢqᵢqᵢᵀ</span>) — but with a <em>different</em> vector on the output side (uᵢ) than the input side (vᵢ), which is exactly what lets it handle non-symmetric and rectangular maps. (This form also re-explains the ellipse you proved last beat: as x circles the unit circle, its coordinates <span class="mono">(v₁·x, v₂·x)</span> trace a circle, and Ax is those circular coordinates laid along the perpendicular axes σ₁u₁, σ₂u₂ — the parametric equation of an ellipse.)</p>
    <div class="task"><b>Confirm the shape of Ax</b>Given <span class="mono">x = (v₁·x)v₁ + (v₂·x)v₂</span> and <span class="mono">Avᵢ = σᵢuᵢ</span>, what is <span class="mono">Ax</span>?</div>

  const opts=[['<span class="cm">σ₁(v₁·x)u₁ + σ₂(v₂·x)u₂</span>','y'],['<span class="cm">(v₁·x)v₁ + (v₂·x)v₂</span>','n'],['<span class="cm">σ₁u₁ + σ₂u₂</span>','n'],['<span class="cm">λ₁x</span>','n']];

    addReveal(`<div class="rh">✓ Ax = σ₁(v₁·x)u₁ + σ₂(v₂·x)u₂</div><p>Read the coefficient of each output axis <span class="mono">uᵢ</span>: it's <span class="mono">σᵢ</span> times the input coordinate <span class="mono">vᵢ·x</span>. Stack the vᵢ into a matrix V, the σᵢ into Σ, the uᵢ into U, and this sum <em>is</em> the matrix product <span class="mono">UΣVᵀx</span>. So <span class="mono">A = UΣVᵀ</span> — the geometry and the factorization are the same statement.</p>`);});

function m6_statement(){
  stage.innerHTML=`<div class="card"><h2>The SVD, defined</h2>
    <p>Now state it cleanly. For <b>any</b> <span class="mono">m × n</span> matrix A:</p>
    <div class="task"><b>Definition — the Singular Value Decomposition</b><span class="mono">A = U Σ Vᵀ</span>, where<br>• <span class="mono">V</span> is <span class="mono">n×n</span> orthogonal — columns v₁…vₙ (right singular vectors), an orthonormal basis of the <em>input</em> space ℝⁿ;<br>• <span class="mono">Σ</span> is <span class="mono">m×n</span>, zero except for singular values <span class="mono">σ₁ ≥ σ₂ ≥ … ≥ 0</span> on the diagonal;<br>• <span class="mono">U</span> is <span class="mono">m×m</span> orthogonal — columns u₁…uₘ (left singular vectors), an orthonormal basis of the <em>output</em> space ℝᵐ.</div>
    <p>The three factors have <em>different shapes</em> for a rectangular A — U is square in the output size, V is square in the input size, and Σ is the same shape as A, bridging them.</p>
    <p><b>Rotate · stretch · rotate, now earned (not asserted).</b> V and U are orthogonal, and from Module 5 that means they're rigid motions — rotations/reflections that preserve every length and angle. Σ is a pure axis-aligned scaling. So reading <span class="mono">A = UΣVᵀ</span> right to left: <span class="mono">Vᵀ</span> rotates the input so the vᵢ line up with the axes, <span class="mono">Σ</span> stretches each axis by its σ, <span class="mono">U</span> rotates onto the output frame. <em>Every</em> linear map is exactly this — no exceptions, because (next beat) the vᵢ always exist.</p>
    <div class="task"><b>Shapes check</b>If A is <span class="mono">2 × 3</span> (maps ℝ³ → ℝ²), what size is U?</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['2 × 2','y'],['3 × 3','n'],['2 × 3','n'],['3 × 2','n']];
  shuffle(opts);
  const chd=document.getElementById('ch');let done=false;chd.innerHTML=opts.map((o,i)=>`<div class="choice" data-i="${i}">${o[0]}</div>`).join('');
  chd.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    chd.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();
    addReveal(`<div class="rh">✓ 2 × 2</div><p>U is an orthonormal basis of the <em>output</em> space ℝᵐ = ℝ², so it's m×m = 2×2. V would be n×n = 3×3 (the input space), and Σ is 2×3, the same shape as A. Why it's used, in one breath: the SVD reads off the rank, gives the best low-rank approximation of A, powers PCA and least squares, and is the most-used factorization in all of numerical computing. We'll see all of that — but first, why it always exists.</p>`);});
  setHints([`U is an orthonormal basis of the output space. A 2×3 matrix outputs into ℝ².`]);
}
function m6_whyaata(){
  stage.innerHTML=`<div class="card"><h2>Why AᵀA — and why it's no trick</h2>
    <p>We still need to actually <em>find</em> the vᵢ and σᵢ. Reason it out instead of memorizing. The top right singular vector v₁ is <em>defined</em> as the input direction of <b>maximum stretch</b> — the unit x maximizing <span class="mono">|Ax|</span>.</p>
    <p>First a small but essential move: instead of maximizing the stretch <span class="mono">|Ax|</span>, maximize its <em>square</em> <span class="mono">|Ax|²</span>. This finds the <b>same direction</b>, because <span class="mono">|Ax| = √(|Ax|²)</span> and the square root is strictly increasing — the x that makes <span class="mono">|Ax|²</span> largest is the very x that makes <span class="mono">|Ax|</span> largest. (Only the peak's <em>location</em> matters here, and squaring a nonnegative quantity never moves the location of its peak.) So we may work with the square, which expands cleanly:</p>
    <div class="eqbox">|Ax|² = (Ax)ᵀ(Ax) = xᵀ AᵀA x</div>
    <p>Look what appeared: the squared stretch is a <b>quadratic form</b>, <span class="mono">xᵀAᵀAx</span> (Module 5) — and here's the one property that unlocks everything: <b>the matrix inside it, <span class="mono">AᵀA</span>, is symmetric for any A whatsoever</b> (you proved this in Module 5, Problem 1: <span class="mono">(AᵀA)ᵀ = Aᵀ(Aᵀ)ᵀ = AᵀA</span>). Symmetric is exactly the condition Module 5's Rayleigh result needs.</p>
    <p><b>So we substitute it in.</b> Rayleigh said: for <em>any</em> symmetric M, the max of <span class="mono">xᵀMx</span> over unit x is M's largest eigenvalue, at M's top eigenvector. Set <span class="mono">M = AᵀA</span> (legal, because it's symmetric), and the max-stretch problem is solved:</p>
    <div class="eqbox">v₁ = top eigenvector of AᵀA,&nbsp;&nbsp;max |Ax|² = top eigenvalue of AᵀA&nbsp;&nbsp;→&nbsp;&nbsp;σ₁ = √λ₁</div>
    <p><b>Close the loop — why the <em>input</em> singular direction is the eigenvector.</b> The top right singular vector v₁ was defined as argmax of the stretch <span class="mono">|Ax|</span> over unit <em>inputs</em> x. Rayleigh found argmax of the form <span class="mono">|Ax|² = xᵀAᵀAx</span>, which is AᵀA's top eigenvector. Those two argmaxes are the <em>same vector</em> (the square-root step above), so v₁ literally equals AᵀA's top eigenvector, with stretch <span class="mono">σ₁ = √λ₁</span>. Note the maximization ran over <em>input</em> directions x, so what it can produce are input directions: AᵀA's eigenvectors are exactly the <b>right</b> singular vectors <span class="mono">vᵢ</span> (inputs, in ℝⁿ) — <em>not</em> the left ones <span class="mono">uᵢ</span> (outputs, in ℝᵐ). The outputs come afterward, from <span class="mono">uᵢ = Avᵢ/σᵢ</span>.</p>
    <p>Running the same argument down the eigenvalues (largest to smallest) gives every singular value and direction. The clean statement, worth memorizing:</p>
    <div class="eqbox"><span class="hl">the singular values of A are the square roots of the eigenvalues of AᵀA</span><br>σᵢ² = λᵢ(AᵀA);&nbsp;&nbsp;the <b>right</b> singular vectors vᵢ (inputs, ℝⁿ) are AᵀA's orthonormal eigenvectors<br>the <b>left</b> singular vectors uᵢ (outputs, ℝᵐ) are AAᵀ's — same nonzero eigenvalues σᵢ²</div>
    <p><b>Why route through AᵀA at all?</b> Because A itself gives you nothing to grab: it may be rectangular (no eigenvalues defined), or square but non-symmetric (complex or non-perpendicular eigenvectors). Forming AᵀA converts your arbitrary A into a <em>symmetric</em> matrix — and symmetric matrices are the one family the spectral theorem fully tames (real eigenvalues, orthonormal eigenvectors). Those eigenvalues come out nonnegative too (each equals <span class="mono">|Avᵢ|² ≥ 0</span>, so the square roots σᵢ are real), which is precisely what guarantees the SVD exists for <em>every</em> matrix. AᵀA is the bridge from "any matrix" to "a matrix we already know how to diagonalize."</p>
    <p>The last piece: <span class="mono">uᵢ = Avᵢ / σᵢ</span>. These come out orthonormal for free — <span class="mono">uᵢ·uⱼ = (Avᵢ·Avⱼ)/(σᵢσⱼ) = (vᵢᵀAᵀAvⱼ)/(σᵢσⱼ) = λⱼ(vᵢ·vⱼ)/(σᵢσⱼ)</span>, which is 1 when i=j and 0 otherwise — so U is orthogonal, completing the decomposition.</p>
    <div class="task"><b>Why does AᵀA appear?</b>Pick the real reason.</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['because the squared stretch |Ax|² equals xᵀAᵀAx, a quadratic form','y'],['because AᵀA is easier to invert','n'],['because A isn\'t square','n'],['it\'s an arbitrary convention','n']];
  shuffle(opts);
  const chd=document.getElementById('ch');let done=false;chd.innerHTML=opts.map((o,i)=>`<div class="choice" data-i="${i}">${o[0]}</div>`).join('');
  chd.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    chd.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();
    addReveal(`<div class="rh">✓ |Ax|² = xᵀAᵀAx</div><p>Finding the most-stretched direction is maximizing a quadratic form, and quadratic forms are governed by their matrix's eigenvectors (Module 5). AᵀA is that matrix, it's symmetric, and the spectral theorem does the rest. The recipe — <span class="mono">V</span> = eigenvectors of AᵀA, <span class="mono">σ</span> = √(its eigenvalues), <span class="mono">uᵢ = Avᵢ/σᵢ</span> — is a <em>consequence</em>, not an incantation.</p>`);});
  setHints([`Expand |Ax|² as (Ax)ᵀ(Ax) and simplify — what symmetric matrix appears in the middle?`]);
}

function m6_rectangular(){
  stage.innerHTML=`<div class="card"><h2>A rectangular matrix, worked</h2>
    <p>The whole promise was "any shape," so let's actually do a non-square one. Take the wide matrix with rows <span class="mono">(2, 0, 0)</span> and <span class="mono">(0, 3, 4)</span> — a <span class="mono">2×3</span> map from ℝ³ to ℝ². Its SVD will have <span class="mono">U</span> (2×2), <span class="mono">Σ</span> (2×3), <span class="mono">V</span> (3×3).</p>
    <p><b>A shortcut worth knowing.</b> The vᵢ are eigenvectors of <span class="mono">AᵀA</span> (here 3×3), but the uᵢ are eigenvectors of <span class="mono">AAᵀ</span> (here 2×2) — and the two share the same nonzero eigenvalues. So use the <em>smaller</em> one. Compute <span class="mono">AAᵀ</span>:</p>
    <div class="eqbox">AAᵀ = ${mat('4','0','0','25')}&nbsp;&nbsp;<span style="color:#5d7186">= (row₁·row₁, row₁·row₂; row₂·row₁, row₂·row₂)</span></div>
    <p>Eigenvalues 25 and 4, so <span class="mono">σ₁ = √25</span>, <span class="mono">σ₂ = √4</span>, with left singular vectors <span class="mono">u₁ = (0,1)</span> (for 25) and <span class="mono">u₂ = (1,0)</span> (for 4). Recover the vᵢ from <span class="mono">vᵢ = Aᵀuᵢ/σᵢ</span>: <span class="mono">v₁ = Aᵀ(0,1)/5 = (0,3,4)/5 = (0, 0.6, 0.8)</span> and <span class="mono">v₂ = Aᵀ(1,0)/2 = (2,0,0)/2 = (1, 0, 0)</span>.</p>

  numChk(stage.querySelector('.card'),5,()=>{document.getElementById('more').innerHTML=`<div class="reveal"><div class="rh">✓ σ₁ = 5, σ₂ = 2</div>

function m6_rank1(){
  stage.innerHTML=`<div class="card"><h2>A as a sum — and the best approximation</h2>
    <p>Just like the spectral theorem, the SVD has a sum form — one rank-1 piece per singular value:</p>
    <div class="eqbox">A = σ₁ u₁v₁ᵀ + σ₂ u₂v₂ᵀ + …</div>
    <p>Same shape as Module 5's <span class="mono">Σ λᵢ qᵢqᵢᵀ</span>, but now the left and right vectors differ (<span class="mono">uᵢ vᵢᵀ</span> instead of <span class="mono">qᵢ qᵢᵀ</span>), which is what lets it handle any matrix. Each term is weighted by its singular value, so the biggest σ's carry the most of A.</p>
    <p>Here's the payoff that makes the SVD indispensable. To <b>compress</b> or <b>denoise</b> A, just keep the largest few terms and drop the rest:</p>
    <div class="eqbox">A ≈ σ₁ u₁v₁ᵀ + … + σ_k u_kv_kᵀ&nbsp;&nbsp;<span style="color:#5d7186">best possible rank-k approximation</span></div>
    <p>A theorem (Eckart–Young) guarantees this truncation is the <em>best</em> rank-k approximation of A that exists — no other rank-k matrix is closer. A 1000×1000 image with a few dozen dominant singular values compresses to a fraction of its size with almost no visible loss; the tiny σ's were mostly noise. This single idea is image compression, PCA, topic models, and recommender systems.</p></div>`;
  setHints([]);unlock();
}
function m6_apps(){

    <p><b>PCA.</b> Center your data matrix and take its SVD: the right singular vectors are the principal directions, and the singular values (squared) are the variance along each. Keeping the top few is dimensionality reduction — the same "biggest σ's carry the most" idea.</p>
    <p><b>Compression & denoising.</b> Truncating to the top-k singular values is the best rank-k approximation (last beat) — used on images, and to strip noise (small σ's) from signals and data.</p>
    <p><b>Least squares & the pseudoinverse.</b> When <span class="mono">Ax = b</span> has no exact solution, the SVD builds the <em>pseudoinverse</em> that gives the least-squares answer directly — the robust way to fit models, especially when A is rank-deficient (Module 2's null space made concrete).</p>
    <p><b>Recommender systems & LSA.</b> Netflix-style recommendation and latent semantic analysis factor a giant sparse matrix (users×movies, documents×words) with a truncated SVD to expose hidden "taste" or "topic" dimensions.</p>
    <div class="code"><div class="ch">python · numpy</div><pre><span class="kw">import</span> numpy <span class="kw">as</span> np

function m6_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Strang-level, within Modules 1–6. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">compute</span><div class="ph">Problem 1</div>
    <p>Find the singular values of <span class="mono">A = ${mat('3','0','0','−4')}</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>AᵀA = ${mat('3','0','0','−4')}${mat('3','0','0','−4')} = ${mat('9','0','0','16')} (it's diagonal, and AᵀA = A² here since A is diagonal). Eigenvalues 9 and 16, so σ = √9 = 3 and √16 = 4. Ordered: σ₁ = 4, σ₂ = 3. (For a diagonal matrix the singular values are the <em>absolute values</em> of the entries — the sign is absorbed into U.)</p></div></details></div>

    <div class="prob"><span class="lvl">full SVD</span><div class="ph">Problem 2</div>
    <p>Find the full SVD (U, Σ, V) of <span class="mono">A = ${mat('0','3','2','0')}</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>AᵀA = ${mat('0','2','3','0')}${mat('0','3','2','0')} = ${mat('4','0','0','9')}. Eigenvalues 9, 4 → σ₁ = 3 (eigenvector v₁ = (0,1)), σ₂ = 2 (v₂ = (1,0)). u₁ = Av₁/σ₁ = A(0,1)/3 = (3,0)/3 = (1,0); u₂ = Av₂/σ₂ = A(1,0)/2 = (0,2)/2 = (0,1). So U = ${mat('1','0','0','1')}, Σ = ${mat('3','0','0','2')}, V = ${mat('0','1','1','0')}. Check: ΣVᵀ = ${mat('3','0','0','2')}${mat('0','1','1','0')} = ${mat('0','3','2','0')} = A ✓.</p></div></details></div>

    <div class="prob"><span class="lvl">proof</span><div class="ph">Problem 3</div>
    <p>Show that the squares of the singular values of A are exactly the eigenvalues of <span class="mono">AᵀA</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Write A = UΣVᵀ. Then AᵀA = (UΣVᵀ)ᵀ(UΣVᵀ) = VΣᵀUᵀUΣVᵀ. Since U is orthogonal, UᵀU = I, leaving AᵀA = VΣᵀΣVᵀ = V(Σ²)Vᵀ. This is a diagonalization of AᵀA with orthogonal V, so it's the spectral decomposition: the diagonal entries of Σ² — the σᵢ² — are the eigenvalues of AᵀA, and V's columns are its eigenvectors.</p></div></details></div>

    <div class="prob"><span class="lvl">connect to Module 2</span><div class="ph">Problem 4</div>
    <p>Explain why the rank of A equals the number of nonzero singular values.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>From A = σ₁u₁v₁ᵀ + σ₂u₂v₂ᵀ + …, each term with σᵢ > 0 contributes one independent direction to the column space (uᵢ), and terms with σᵢ = 0 contribute nothing. Since the uᵢ are orthonormal (hence independent), the column space is spanned by exactly the uᵢ with nonzero σᵢ — so its dimension, the rank, is the count of nonzero singular values. (Equivalently: multiplying by the orthogonal U and V can't change rank, so rank A = rank Σ = number of nonzero diagonal entries.)</p></div></details></div>

    <div class="prob"><span class="lvl">connect to Module 5</span><div class="ph">Problem 5</div>
    <p>Show that for a symmetric <em>positive definite</em> matrix, the SVD is the same as the eigendecomposition (σᵢ = λᵢ and U = V = the eigenvectors).</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>By the spectral theorem A = QΛQᵀ with Q orthogonal and Λ diagonal with λᵢ > 0 (positive definite). This already has the form A = UΣVᵀ with U = Q, V = Q, Σ = Λ — and since all λᵢ > 0 they're valid (nonnegative) singular values. So σᵢ = λᵢ and the left/right singular vectors both equal the eigenvectors. (If A were symmetric but had a negative eigenvalue, the SVD would take σ = |λ| and absorb the sign into U, so U ≠ V there.)</p></div></details></div>

    <div class="prob"><span class="lvl">low-rank</span><div class="ph">Problem 6</div>
    <p>A matrix has SVD with singular values σ₁ = 10, σ₂ = 8, σ₃ = 0.05. What is the best rank-2 approximation, and roughly how much is lost?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Keep the two largest terms: A₂ = σ₁u₁v₁ᵀ + σ₂u₂v₂ᵀ (drop the σ₃ term). By Eckart–Young this is the best possible rank-2 approximation. The error is governed by the discarded singular value — here just σ₃ = 0.05, tiny compared to 10 and 8, so the approximation is excellent: the third direction carried almost nothing (likely noise). This is exactly why keeping the top few singular values compresses data so effectively.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge</span><div class="ph">Problem 7</div>
    <p>Prove that the maximum of <span class="mono">|Ax|</span> over all unit vectors x equals σ₁, the largest singular value — the fact the ellipse demo showed.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Maximize |Ax|² instead (same maximizer). |Ax|² = (Ax)ᵀ(Ax) = xᵀAᵀAx. Now AᵀA is symmetric with eigenvalues σᵢ² and orthonormal eigenvectors vᵢ. By the Rayleigh-quotient result from Module 5 (Problem 7), the maximum of xᵀ(AᵀA)x over unit x is the largest eigenvalue of AᵀA, namely σ₁², attained at x = v₁. Taking square roots, max |Ax| = σ₁ at x = v₁. So the longest semi-axis of the ellipse is σ₁, reached from the input direction v₁ — precisely what you found by dragging.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function m4_detmore(){
  stage.innerHTML=`<div class="card"><h2>What a determinant really is</h2>
    <p>We used <span class="mono">ad − bc</span> as a singularity detector, but it deserves a real meaning — one that instantly explains the formula and scales to any size. Here it is, geometric and definition-level:</p>
    <div class="task"><b>Definition</b>The determinant of A is the <b>signed factor by which A scales volume</b>. In 2D: the unit square (area 1) maps to a parallelogram whose (signed) area is det A. In 3D: the unit cube maps to a parallelepiped of (signed) volume det A. In n-D: the unit hypercube's volume is multiplied by det A.</div>
    <p>Everything follows from that one idea:</p>
    <p>• <b>det A = 0 ⟺ singular.</b> Zero volume means the cube got flattened into a lower dimension — the columns don't span, so they're dependent and A has a nonzero null space. That's the equivalence we used, now <em>explained</em> rather than asserted.</p>
    <p>• <b>The sign</b> tells you orientation: positive if A preserves handedness, negative if it flips it (a reflection). We only ever need <span class="mono">|det|</span> for "is it zero," so the sign rarely matters here.</p>
    <p>• <b>Products multiply:</b> <span class="mono">det(AB) = det A · det B</span> — do two maps, the volume factors multiply. (So <span class="mono">det(A⁻¹) = 1/det A</span>, and a singular map can't be undone.)</p>
    <p><b>Computing it.</b> The 2×2 formula <span class="mono">ad − bc</span> is exactly the signed area of the parallelogram spanned by the columns. For 3×3 there's an analogous (longer) formula; for general n×n, the systematic method is <b>cofactor expansion</b> — write det A as an alternating sum of entries times the determinants of smaller (n−1)×(n−1) matrices, recursing down to 2×2:</p>
    <div class="eqbox">det ${mat('a','b','c','d')} = ad − bc;&nbsp;&nbsp; larger n: expand along a row into ± (entry) · (minor), recurse</div>
    <p class="small">Honest note for later: cofactor expansion is a <em>definition</em>, not a practical algorithm — its cost explodes with n. In real software a determinant is computed by row-reduction (Gaussian elimination) in a fraction of the time, and — crucially — <em>eigenvalues of large matrices are never found via</em> <span class="mono">det(A−λI)=0</span> at all; the characteristic polynomial is numerically hopeless past tiny sizes, so iterative algorithms are used instead. That "how do we actually compute these" story is a computational-methods topic in its own right — a natural future course. For hand-worked small examples, the formula above is all we need.</p></div>`;
  setHints([]);unlock();
}
function m6_ellipsedef(){
  stage.innerHTML=`<div class="card"><h2>What "ellipse" means algebraically</h2>
    <p>Before we can <em>prove</em> the image of the circle is an ellipse, we need to pin down what an ellipse actually is in linear-algebra terms — and, along the way, define one term we've used loosely.</p>
    <p><b>Positive definite, as a property of a matrix.</b> In Module 5 we called a quadratic form "positive definite"; here's the matrix version. A symmetric matrix M is <b>positive definite</b> when</p>
    <div class="eqbox">xᵀ M x &gt; 0&nbsp;&nbsp;for every nonzero x&nbsp;&nbsp;<span style="color:#5d7186">⟺&nbsp; every eigenvalue of M is positive</span></div>
    <p>The equivalence is exactly Module 5's spectral picture: in M's orthonormal eigenbasis, <span class="mono">xᵀMx = Σ λᵢcᵢ²</span>, a weighted sum of squares — always positive precisely when all the weights λᵢ are positive.</p>
    <p><b>Now, the ellipse.</b> An ellipse (centered at the origin) is the solution set of</p>
    <div class="eqbox">yᵀ M y = 1&nbsp;&nbsp;<span style="color:#5d7186">for a symmetric positive-definite M</span></div>
    <p>Why is that curve an ellipse and not something else? Diagonalize the symmetric M as <span class="mono">M = QΛQᵀ</span> (spectral theorem) and rewrite <span class="mono">y</span> in M's eigenbasis, coordinates <span class="mono">c = Qᵀy</span>. The equation becomes pure squares:</p>
    <div class="eqbox">yᵀMy = 1&nbsp;⟹&nbsp;λ₁c₁² + λ₂c₂² = 1&nbsp;⟹&nbsp;<sup>c₁²</sup>⁄<sub>(1/√λ₁)²</sub> + <sup>c₂²</sup>⁄<sub>(1/√λ₂)²</sub> = 1</div>
    <p>That last form is the textbook equation of an ellipse: its axes point along <b>M's eigenvectors</b> (the columns of Q), and its semi-axis lengths are <b>1/√λᵢ</b>. Positive definiteness is what guarantees every <span class="mono">λᵢ &gt; 0</span>, so every <span class="mono">1/√λᵢ</span> is a real, finite axis length — a genuine ellipse (a negative or zero λ would give a hyperbola or a degenerate flat instead).</p>
    <div class="task"><b>Check the axis lengths</b>If <span class="mono">M</span> has eigenvalues 4 and 25, what are the ellipse's two semi-axis lengths?</div>
    <div class="entry"><input id="ni" placeholder="e.g. 3, 7"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <div id="more"></div></div>`;
  numChk(stage.querySelector('.card'),[0.5,0.2],()=>{document.getElementById('more').innerHTML=`<div class="reveal"><div class="rh">✓ 1/√4 = 0.5 and 1/√25 = 0.2</div>
    <p>Semi-axis length is <span class="mono">1/√λ</span>, so 1/√4 = 1/2 and 1/√25 = 1/5. A <em>bigger</em> eigenvalue means a <em>shorter</em> axis — the quadratic climbs to 1 faster in that direction. Keep this correspondence in hand: it's exactly what the next beat produces when it shows the image of the unit circle satisfies <span class="mono">yᵀMy=1</span>.</p></div>`;unlock();},s=>parseVec(s).sort((a,b)=>b-a));
  setHints([`Semi-axis length along an eigen-direction is 1/√λ for that eigenvalue.`,`1/√4 and 1/√25 — enter either order.`]);
}
function m6_ellipseproof(){
  stage.innerHTML=`<div class="card"><h2>Proof: the image really is an ellipse</h2>
    <p>The interactive <em>showed</em> a circle becoming an ellipse; let's <em>prove</em> it — without leaning on the SVD (that would be circular, since the ellipse is what motivates the SVD). We now know exactly what to aim for: from the last beat, an ellipse is the solution set of <span class="mono">yᵀMy = 1</span> for a symmetric positive-definite M. So it's enough to show the image points satisfy such an equation.</p>
    <p>Take an invertible A and the unit circle — the points x with <span class="mono">xᵀx = 1</span>. Each maps to <span class="mono">y = Ax</span>, so <span class="mono">x = A⁻¹y</span>. Substitute into the circle's own equation:</p>
    <div class="eqbox">xᵀx = 1 &nbsp;⟹&nbsp; (A⁻¹y)ᵀ(A⁻¹y) = 1 &nbsp;⟹&nbsp; yᵀ (A⁻¹)ᵀA⁻¹ y = 1 &nbsp;⟹&nbsp; yᵀ M y = 1</div>
    <p>with <span class="mono">M = (A⁻¹)ᵀA⁻¹</span>. So the image points satisfy exactly an ellipse equation — provided M is symmetric positive-definite. It is, by facts you already proved: writing <span class="mono">B = A⁻¹</span>, <span class="mono">M = BᵀB</span> is <b>symmetric</b> (<span class="mono">(BᵀB)ᵀ = BᵀB</span>, Module 5) and <b>positive-definite</b> (<span class="mono">yᵀBᵀBy = ‖By‖² > 0</span> for <span class="mono">y ≠ 0</span>, since B is invertible so By ≠ 0). ∎</p>
    <div class="task"><b>What forced the image to be an ellipse?</b></div>
    <div class="choices" id="ch"></div>
    <p class="small" style="margin-top:12px">The one restriction: this assumed A invertible so <span class="mono">A⁻¹</span> exists. If A is singular or rectangular, the image is a <em>degenerate</em> ellipse — the circle collapses onto a lower-dimensional flat (a line segment, or in higher dimensions a flattened disk). The singular values that vanish are exactly those collapsed directions (σ = 0).</p></div>`;
  const opts=[['the circle\'s equation transforms into <span class="cm">yᵀMy=1</span> with M symmetric-PD','y'],['A is a rotation, so it maps circles to circles','n'],['the SVD guarantees it','n'],['every quadratic curve is an ellipse','n']];
  shuffle(opts);
  const chd=document.getElementById('ch');let done=false;chd.innerHTML=opts.map((o,i)=>`<div class="choice" data-i="${i}">${o[0]}</div>`).join('');
  chd.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    chd.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();
    addReveal(`<div class="rh">✓ The circle's equation, transformed</div><p>The image is the solution set of <span class="mono">yᵀMy=1</span> with <span class="mono">M=(A⁻¹)ᵀA⁻¹</span> symmetric positive-definite — the very definition of an ellipse. No SVD needed; just change of variables plus "BᵀB is symmetric PD." And it ties back to Module 5: the image ellipse's axes are the eigenvectors of M, which is why perpendicular input directions map to perpendicular ellipse axes — the fact the SVD then names v's and u's.</p>`);});
  setHints([`Turn the circle's equation xᵀx=1 into an equation in y=Ax by substituting x=A⁻¹y. What kind of matrix ends up sandwiched in the middle?`]);
}
function m6_eckart(){
  stage.innerHTML=`<div class="card"><h2>Why the truncation is the <em>best</em> approximation</h2>
    <p>We claimed keeping the top k terms of <span class="mono">A = Σ σᵢ uᵢvᵢᵀ</span> gives the best rank-k approximation. Let's prove the concrete, checkable half — <b>exactly how much error the truncation leaves</b> — and be honest about the rest.</p>
    <p>Write the truncation and its error:</p>
    <div class="eqbox">A_k = Σ_{i≤k} σᵢ uᵢvᵢᵀ,&nbsp;&nbsp; A − A_k = Σ_{i&gt;k} σᵢ uᵢvᵢᵀ</div>
    <p>The leftover is itself an SVD-style sum — the <em>dropped</em> terms — with singular values <span class="mono">σ_{k+1} ≥ σ_{k+2} ≥ …</span>. Its largest singular value is the first one dropped, <span class="mono">σ_{k+1}</span>, so the size of the error (its spectral norm — the maximum stretch it applies to any unit vector) is exactly:</p>
    <div class="eqbox"><span class="hl">‖A − A_k‖ = σ_{k+1}</span>&nbsp;&nbsp;<span style="color:#5d7186">the first singular value you threw away</span></div>
    <p>That's why it works so well in practice: if the discarded singular values are tiny, the error is tiny. Keep enough terms that <span class="mono">σ_{k+1}</span> is negligible and <span class="mono">A_k ≈ A</span> to whatever precision you want — image compression, PCA, denoising all live on this one equation.</p>
    <div class="task"><b>Read off the error</b>A matrix has singular values 10, 6, 0.2, 0.05. What is the error <span class="mono">‖A − A₂‖</span> of the best rank-2 approximation?</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <div id="more"></div></div>`;
  numChk(stage.querySelector('.card'),0.2,()=>{document.getElementById('more').innerHTML=`<div class="reveal"><div class="rh">✓ 0.2 — the first dropped singular value</div>
    <p>Rank-2 keeps σ₁=10 and σ₂=6; the error is <span class="mono">σ₃ = 0.2</span>. The third and fourth directions carried almost nothing, so rank-2 loses almost nothing.</p>
    <p><b>The optimality half — cited, not proven here.</b> The full <b>Eckart–Young theorem</b> says more: <em>no</em> rank-k matrix of any kind approximates A better than this truncation — it's the global best, not just a good choice. That direction needs machinery we haven't built (properties of matrix norms and a minimization argument over all rank-k matrices), so we state it as a theorem to rely on rather than derive. What we <em>did</em> prove — the error equals σ_{k+1} — is the part you compute with, and it's honest and exact.</p></div>`;unlock();});
  setHints([`Rank-2 keeps the two largest singular values. The error is the next one down.`,`Keep 10 and 6; the error is σ₃ = 0.2.`]);
}
